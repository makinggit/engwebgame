<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Story Time</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
body {
	min-height: 100vh;
	background: linear-gradient(160deg, #c9f0ff, #ffe6f7 55%, #fff6c9);
}
.story-wrap {
	width: min(760px, calc(100% - 24px));
	margin: 18px auto;
}
.story-card {
	position: relative;
	background: #fff;
	border: 6px solid #ffd166;
	border-radius: 34px;
	box-shadow: 0 18px 40px rgba(68, 51, 122, .18);
	padding: clamp(20px, 5vw, 38px);
	overflow: hidden;
}
.story-card::before {
	content: "";
	position: absolute;
	inset: -30% -10% auto;
	height: 220px;
	background: radial-gradient(circle at 20% 50%, #ffe06655, transparent 60%),
		radial-gradient(circle at 80% 30%, #a0e7ff55, transparent 60%);
	pointer-events: none;
}
.story-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 14px;
}
.level-badge {
	background: #7c5cff;
	color: white;
	font: 900 clamp(15px, 3.5vw, 21px) "Trebuchet MS", sans-serif;
	padding: 9px 16px;
	border-radius: 999px;
	box-shadow: 0 5px 0 #5a3fd1;
}
.mascots {
	font-size: clamp(30px, 8vw, 48px);
	line-height: 1;
}
.story-title {
	margin: 4px 0 14px;
	color: #44337a;
	font: 900 clamp(27px, 7vw, 44px)/1.15 "Trebuchet MS", sans-serif;
}
.story-text {
	background: #fff8e1;
	border: 4px dashed #ffb703;
	border-radius: 24px;
	padding: clamp(16px, 4vw, 28px);
	color: #333;
	font: 700 clamp(19px, 4.4vw, 27px)/1.55 "Trebuchet MS", sans-serif;
}
.story-controls {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	justify-content: center;
	margin-top: 22px;
}
.story-button {
	border: 0;
	border-radius: 999px;
	padding: 15px 24px;
	font: 900 clamp(17px, 4vw, 23px) "Trebuchet MS", sans-serif;
	color: #333;
	cursor: pointer;
	box-shadow: 0 6px 0 rgba(0,0,0,.15);
	touch-action: manipulation;
}
.story-button.listen {
	background: #ffd166;
}
.story-button.games {
	background: #a0e7ff;
}
.story-button:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.story-button:focus-visible { outline: 4px solid #7c5cff; outline-offset: 3px; }
.story-footer {
	margin-top: 16px;
	text-align: center;
	color: #666;
	font: 700 15px "Trebuchet MS", sans-serif;
}
@media (max-width: 480px) {
	.story-header { align-items: flex-start; }
}
</style>
</head>
<body>
<main class="story-wrap">
	<section class="story-card" aria-labelledby="storyTitle">
		<div class="story-header">
			<div class="level-badge" id="levelBadge">Level 1</div>
			<div class="mascots" aria-hidden="true">👾📚🤖</div>
		</div>
		<h1 class="story-title" id="storyTitle">Story Time</h1>
		<article class="story-text" id="storyText">
			Loading your adventure...
		</article>
		<div class="story-controls">
			<button class="story-button listen" id="listenBtn" type="button">🔊 Listen to the Story</button>
			<button class="story-button games" id="gamesBtn" type="button">🎮 Back to Games</button>
		</div>
		<p class="story-footer">Tap the yellow button to hear Momo and Bolt’s adventure!</p>
	</section>
</main>

<script src="./assets/common.js"></script>
<script src="./assets/story.js"></script>
<script>
const { $, getParams, readProgress, buildProgressQuery, say, sounds } = RoboCommon;

const { level, stars } = readProgress();
const story = RoboStory.getStoryPage(level);

$("levelBadge").textContent = "Level " + level;
$("storyTitle").textContent = story.title;
$("storyText").textContent = story.text;
$("listenBtn").onclick = () => {
	sounds.hear();
	say(story.title + ". " + story.text);
};
$("gamesBtn").onclick = () => {
	sounds.hear();
	window.location.assign("./game_mode.html?" + buildProgressQuery(level, stars));
};
</script>
</body>
</html>
