<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd166">
<title>Robo-Monster Adventure Map</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
body {
	min-height: 100vh;
	background: linear-gradient(180deg, #a8e6ff, #d9f7d9 45%, #fff3b0);
}
.map-wrap {
	width: min(720px, calc(100% - 18px));
	margin: 16px auto;
}
.map-card {
	background: #fffdf5;
	border: 7px solid #7c5cff;
	border-radius: 36px;
	box-shadow: 0 20px 45px rgba(50, 30, 100, .2);
	padding: clamp(18px, 4vw, 30px);
}
.map-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;
}
.level-badge {
	background: #5b2a86;
	color: #fff;
	font: 900 clamp(14px, 3.4vw, 20px) "Trebuchet MS", sans-serif;
	padding: 9px 15px;
	border-radius: 999px;
	box-shadow: 0 5px 0 #3d1a60;
}
.map-title {
	margin: 12px 0 4px;
	color: #5b2a86;
	font: 900 clamp(29px, 7.5vw, 46px)/1.1 "Trebuchet MS", sans-serif;
	text-shadow: 2px 3px #ffd166;
}
.map-subtitle {
	margin: 0 0 20px;
	color: #555;
	font: 800 clamp(15px, 3.6vw, 21px) "Trebuchet MS", sans-serif;
}
.adventure-map {
	position: relative;
	display: flex;
	flex-direction: column;
	gap: 8px;
}
.map-path {
	position: absolute;
	left: 50%;
	top: 30px;
	bottom: 30px;
	width: 8px;
	transform: translateX(-50%);
	background-image: linear-gradient(to bottom, #7c5cff 55%, transparent 45%);
	background-size: 8px 24px;
	border-radius: 8px;
	opacity: .45;
}
.map-stop {
	position: relative;
	z-index: 1;
	display: flex;
	align-items: center;
	gap: 12px;
	width: min(430px, 100%);
	border: 5px solid #ffd166;
	border-radius: 26px;
	background: #fff;
	box-shadow: 0 8px 0 #eadfc4;
	padding: 13px 15px;
	text-align: left;
	cursor: pointer;
	touch-action: manipulation;
}
.map-stop:nth-child(even) { align-self: flex-end; }
.map-stop:nth-child(odd) { align-self: flex-start; }
.map-stop .emoji {
	font-size: clamp(32px, 8vw, 46px);
	line-height: 1;
}
.map-stop .text {
	display: flex;
	flex-direction: column;
	gap: 2px;
}
.map-stop .name {
	color: #333;
	font: 900 clamp(16px, 4vw, 22px) "Trebuchet MS", sans-serif;
}
.map-stop .task {
	color: #666;
	font: 800 clamp(13px, 3.2vw, 17px) "Trebuchet MS", sans-serif;
}
.map-stop.locked {
	border-color: #cfd6df;
	background: #f1f3f6;
	box-shadow: 0 8px 0 #d7dde4;
	filter: grayscale(1);
}
.map-stop.locked .emoji { opacity: .35; }
.map-stop.current {
	border-color: #ff5d8f;
	box-shadow: 0 0 0 5px #ffe0eb, 0 8px 0 #f7b8c9;
}
.momo-marker {
	position: absolute;
	z-index: 2;
	font-size: clamp(30px, 7vw, 42px);
	transform: translate(-50%, -50%);
	filter: drop-shadow(0 4px 4px rgba(0,0,0,.2));
}
.map-controls {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	justify-content: center;
	margin-top: 24px;
}
.map-button {
	border: 0;
	border-radius: 999px;
	padding: 15px 24px;
	font: 900 clamp(16px, 4vw, 22px) "Trebuchet MS", sans-serif;
	color: #333;
	cursor: pointer;
	box-shadow: 0 6px 0 rgba(0,0,0,.16);
}
.map-button.hear { background: #ffd166; }
.map-button.games { background: #a0e7ff; }
.map-button:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.16); }
.map-button:focus-visible { outline: 4px solid #5b2a86; outline-offset: 3px; }
.map-footer {
	margin-top: 15px;
	text-align: center;
	color: #666;
	font: 800 15px "Trebuchet MS", sans-serif;
}
</style>
</head>
<body>
<main class="map-wrap">
	<section class="map-card" aria-labelledby="mapTitle">
		<div class="map-header">
			<div class="level-badge" id="levelBadge">Level 1</div>
			<div aria-hidden="true" style="font-size: clamp(28px, 7vw, 42px)">🗺️🎁👾</div>
		</div>
		<h1 class="map-title" id="mapTitle">Help Momo Find It!</h1>
		<p class="map-subtitle">Momo has found <strong id="foundCount">0</strong> of 12 missing things.</p>
		<div class="adventure-map" id="adventureMap">
			<div class="map-path" aria-hidden="true"></div>
		</div>
		<div class="map-controls">
			<button class="map-button hear" id="hearBtn" type="button">🔊 Hear My Finds</button>
			<button class="map-button games" id="gamesBtn" type="button">🎮 Back to Games</button>
		</div>
		<p class="map-footer">Play games to help Momo move along the map!</p>
	</section>
</main>

<script src="./assets/common.js"></script>
<script>
const { $, readProgress, buildProgressQuery, say, sounds } = RoboCommon;

const { level, stars } = readProgress();
const stops = [
	{ emoji: "🎒", name: "School Bag", task: "Find Momo’s school bag." },
	{ emoji: "🖍️", name: "Yellow Crayon", task: "Find the yellow crayon." },
	{ emoji: "📓", name: "Notebook", task: "Find the magic notebook." },
	{ emoji: "🧽", name: "Eraser", task: "Find the hungry eraser." },
	{ emoji: "📏", name: "Ruler", task: "Find the long ruler." },
	{ emoji: "⭐", name: "First Star", task: "Find the first star." },
	{ emoji: "🐸", name: "Frog Friend", task: "Find the frog with glasses." },
	{ emoji: "🌙", name: "Paper Moon", task: "Find the paper moon." },
	{ emoji: "🎵", name: "Music Note", task: "Find the missing music note." },
	{ emoji: "🔑", name: "Story Key", task: "Find the purple story key." },
	{ emoji: "🔖", name: "Heart Bookmark", task: "Find the heart bookmark." },
	{ emoji: "🏅", name: "Explorer Medal", task: "Find the explorer medal." },
];

const levelUnlocks = Math.min(level * 4, stops.length);
const starUnlocks = Math.min(Math.floor(stars / 3), stops.length - levelUnlocks);
const foundCount = Math.min(levelUnlocks + starUnlocks, stops.length);

$("levelBadge").textContent = "Level " + level;
$("foundCount").textContent = foundCount;

const map = $("adventureMap");
stops.forEach((stop, index) => {
	const found = index < foundCount;
	const isCurrent = index === foundCount;
	const button = document.createElement("button");
	button.type = "button";
	button.className = "map-stop" + (found ? "" : " locked") + (isCurrent ? " current" : "");
	button.setAttribute("aria-label", found
		? stop.name + ": " + stop.task
		: "Locked: " + stop.task);
	button.innerHTML = `
		<span class="emoji" aria-hidden="true">${found ? stop.emoji : "🔒"}</span>
		<span class="text">
			<span class="name">${found ? stop.name : "Mystery Place"}</span>
			<span class="task">${stop.task}</span>
		</span>`;
	button.onclick = () => {
		sounds.click();
		say(found
			? "You found the " + stop.name + ". " + stop.task
			: "Help Momo! " + stop.task);
	};
	map.appendChild(button);
	if (isCurrent) {
		const marker = document.createElement("div");
		marker.className = "momo-marker";
		marker.textContent = "👾";
		marker.setAttribute("aria-hidden", "true");
		button.appendChild(marker);
	}
});

$("hearBtn").onclick = () => {
	sounds.hear();
	const found = stops.slice(0, foundCount).map((stop) => stop.name);
	say(found.length
		? "Momo found: " + found.join(", ") + "."
		: "Help Momo find his first missing thing!");
};
$("gamesBtn").onclick = () => {
	sounds.hear();
	window.location.assign("./game_mode.html?" + buildProgressQuery(level, stars));
};
</script>
</body>
</html>
