<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Spelling · Racing</title>
<link rel="stylesheet" href="assets/game.css">
<link rel="stylesheet" href="assets/game04_racing.css">
</head>
<body>
<div id="racingApp">
  <header class="topbar">
    <a class="back" href="game_mode.html" aria-label="Back">←</a>
    <div class="titles">
      <h1>Spelling Race</h1>
      <p class="sub">Tap the right word to boost your racer</p>
    </div>
    <div class="hud">
      <span class="pill" id="level">Level 1</span>
      <span class="pill" id="stars">★ 0</span>
    </div>
  </header>

  <main class="stage">
    <canvas id="game" width="720" height="360"></canvas>
    <button id="jump" class="jump-btn" aria-label="Jump">JUMP</button>
    <div id="wordPop" class="word-pop" role="dialog" aria-modal="true">
      <div class="pop-card">
        <p class="word" id="popWord">word</p>
        <p class="say" id="popSay">Tap to hear</p>
        <div class="choices" id="popChoices"></div>
        <button class="close" id="popClose" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="levelUp" class="level-up" role="dialog" aria-modal="true">
      <div class="card">
        <h2 id="luTitle">Level Up!</h2>
        <p id="luText"></p>
        <button id="luNext">Continue</button>
      </div>
    </div>
  </main>
</div>

<script src="assets/common.js"></script>
<script src="assets/game-lifecycle.js"></script>
<script>
(function(){
  const { $, $$, readProgress, updateProgress, goTo, speak, sounds, tone } = RoboCommon;
  const { createTimerManager, createGameLifecycle } = RoboGame;
  const timers = createTimerManager();

  const params = new URLSearchParams(location.search);
  let { level, stars } = readProgress();
  let nextMode = "spell";

  const canvas = $('#game');
  const ctx = canvas.getContext('2d');
  const jumpBtn = $('#jump');
  const pop = $('#wordPop');
  const popWord = $('#popWord');
  const popSay = $('#popSay');
  const popChoices = $('#popChoices');
  const popClose = $('#popClose');
  const levelUp = $('#levelUp');
  const luTitle = $('#luTitle');
  const luText = $('#luText');
  const luNext = $('#luNext');

  const words = [
    { word: 'cat', choices: ['cat','cap','car'] },
    { word: 'dog', choices: ['dog','dot','dig'] },
    { word: 'sun', choices: ['sun','fun','run'] },
    { word: 'hat', choices: ['hat','hit','hot'] },
    { word: 'bus', choices: ['bus','bug','but'] },
    { word: 'red', choices: ['red','bed','led'] },
    { word: 'big', choices: ['big','bag','bit'] },
    { word: 'cup', choices: ['cup','cap','cub'] }
  ];

  let lanes = [0,1,2];
  let player = { lane: 1, y: 0, vy: 0, jumping: false };
  let obstacles = [];
  let score = 0;
  let speed = 2.2;
  let lastTime = 0;
  let accumulator = 0;
  let current = null;
  let running = false;

  const G = 0.55;
  const JUMP = -11;

  function resize(){
    const w = Math.min(window.innerWidth - 24, 720);
    const h = Math.round(w * 0.5);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    draw();
  }

  function draw(){
    const w = canvas.width / devicePixelRatio;
    const h = canvas.height / devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    // sky
    ctx.fillStyle = '#dff3ff';
    ctx.fillRect(0,0,w,h);
    // ground
    ctx.fillStyle = '#cdeccd';
    ctx.fillRect(0,h-60,w,60);
    // road
    ctx.fillStyle = '#f4f6f8';
    ctx.fillRect(0,h-60,w,8);
    // player
    const px = 80;
    const py = h-60-40+player.y;
    ctx.fillStyle = '#2f6df6';
    ctx.fillRect(px,py,40,40);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px+8,py+8,10,10);
    // obstacles
    obstacles.forEach(o=>{
      const oy = h-60-30;
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(o.x,oy,26,30);
    });
    // score
    ctx.fillStyle = '#111';
    ctx.font = '16px system-ui';
    ctx.fillText('Score '+score, 12, 24);
  }

  function spawn(){
    const lane = lanes[Math.floor(Math.random()*lanes.length)];
    obstacles.push({ x: canvas.width/devicePixelRatio + 20, lane });
  }

  function update(dt){
    if(!running) return;
    speed += 0.0006*dt;
    obstacles.forEach(o=> o.x -= speed*dt/16);
    obstacles = obstacles.filter(o=> o.x > -40);
    if(player.jumping){
      player.vy += G;
      player.y += player.vy;
      if(player.y >= 0){ player.y = 0; player.vy = 0; player.jumping = false; }
    }
    // collision
    const w = canvas.width/devicePixelRatio;
    const h = canvas.height/devicePixelRatio;
    const px = 80, py = h-60-40+player.y;
    for(const o of obstacles){
      const oy = h-60-30;
      if(px+40 > o.x && px < o.x+26 && py+40 > oy){
        running = false;
        showWordPop();
        break;
      }
    }
    score += Math.round(dt/16);
  }

  function frame(time){
    if(!lastTime) lastTime = time;
    let dt = time - lastTime;
    lastTime = time;
    if(dt > 100) dt = 100;
    accumulator += dt;
    while(accumulator >= 16){ update(16); accumulator -= 16; }
    draw();
    timers.requestAnimationFrame(frame);
  }

  function startRun(){
    running = true;
    obstacles = [];
    score = 0;
    speed = 2.2;
    player = { lane:1, y:0, vy:0, jumping:false };
    lastTime = 0;
    accumulator = 0;
    timers.requestAnimationFrame(frame);
  }

  function showWordPop(){
    current = words[Math.floor(Math.random()*words.length)];
    popWord.textContent = current.word;
    popSay.textContent = 'Tap to hear';
    popChoices.innerHTML = '';
    current.choices.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = c;
      b.onclick = ()=>{
        if(c === current.word){
          stars += 1;
          level = Math.floor(stars/3.0) + 1;
          updateProgress(level, stars);
          sync();
          pop.classList.remove('show');
          startRun();
        } else {
          b.classList.add('wrong');
          timers.setTimeout(say, 1000, "Try again! Listen and choose.");
        }
      };
      popChoices.appendChild(b);
    });
    pop.classList.add('show');
    say(current.word);
  }

  function say(text){
    if(sounds && sounds.hear) sounds.hear(text);
  }

  function sync(){
    $('#level').textContent = 'Level ' + level;
    $('#stars').textContent = '★ ' + stars;
    const url = new URL(location.href);
    url.searchParams.set('level', level);
    url.searchParams.set('stars', stars);
    history.replaceState(null,'',url);
  }

  function showLevelUp(){
    const pool = ['spell','fish','ghost','race'].filter(m=>m!=='race');
    nextMode = pool[Math.floor(Math.random()*pool.length)];
    luTitle.textContent = 'Level Up!';
    luText.textContent = 'Next: ' + nextMode;
    levelUp.classList.add('show');
  }

  jumpBtn.addEventListener('pointerdown', ()=>{
    if(!player.jumping){ player.jumping = true; player.vy = JUMP; }
  });

  popClose.addEventListener('click', ()=>{
    pop.classList.remove('show');
    startRun();
  });

  luNext.addEventListener('click', ()=>{
    levelUp.classList.remove('show');
    goTo('./game_mode.html', level, stars);
  });

  const lifecycle = createGameLifecycle({
    name: 'racing',
    timers,
    hooks: {
      initGame(){
        sync();
        resize();
        startRun();
      },
      pause(){
        running = false;
      },
      resume(){
        lastTime = 0;
        accumulator = 0;
        if(!running){
          running = true;
          timers.requestAnimationFrame(frame);
        }
      },
      cleanup(){
        running = false;
      }
    }
  });

  window.addEventListener('resize', resize);
  lifecycle.initGame();
})();
</script>
</body>
</html>
