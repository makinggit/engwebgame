<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050914">
<title>Robo-Monster Spelling Academy</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
html, body {
	height: 100%;
	margin: 0;
	overflow: hidden;
	background: #050914;
	color: #eaf2ff;
	font-family: "Trebuchet MS", system-ui, sans-serif;
	overscroll-behavior: none;
}
#game {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	touch-action: none;
}
#hud {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 2;
	padding: 10px 12px;
	pointer-events: none;
}
#topRow {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
}
.badge {
	padding: 7px 10px;
	border: 2px solid #3d5a99;
	border-radius: 999px;
	background: rgba(9, 16, 34, .82);
	font: 800 14px system-ui;
	white-space: nowrap;
	pointer-events: auto;
	cursor: pointer;
}
#wordRow {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	margin-top: 8px;
}
#emoji {
	font-size: 30px;
}
#word {
	display: flex;
	gap: 4px;
	font: 900 28px system-ui;
	letter-spacing: 2px;
}
#word span {
	min-width: 22px;
	text-align: center;
	color: #7fd4ff;
}
#word span.done {
	color: #7dff9d;
}
#word span.space {
	min-width: 14px;
}
#hint {
	margin-top: 6px;
	text-align: center;
	font: 800 15px system-ui;
	color: #b9c9ee;
	min-height: 20px;
}
#boostBtn {
	position: fixed;
	right: 14px;
	bottom: 18px;
	z-index: 3;
	min-height: 62px;
	min-width: 112px;
	border: 4px solid #64e0ff;
	border-radius: 22px;
	background: linear-gradient(180deg, #123a63, #0a1f38);
	color: #d9f6ff;
	font: 900 20px "Trebuchet MS", system-ui;
	cursor: pointer;
	touch-action: manipulation;
	box-shadow: 0 0 22px rgba(80, 190, 255, .45);
}
#boostBtn.active {
	background: linear-gradient(180deg, #1c6ea3, #0b2c4d);
	box-shadow: 0 0 32px rgba(100, 224, 255, .8);
}
#boostBtn:active {
	transform: scale(.96);
}
#flash {
	position: fixed;
	inset: 0;
	z-index: 4;
	pointer-events: none;
	background: rgba(255, 70, 70, .22);
	opacity: 0;
	transition: opacity .18s;
}
#flash.on {
	opacity: 1;
}
#wordPop {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .55);
	padding: 18px;
}
#wordPop.show {
	display: grid;
}
.word-card {
	width: min(440px, 94vw);
	background: #fffdf5;
	color: #202452;
	border: 5px solid #64e0ff;
	border-radius: 26px;
	padding: 22px;
	text-align: center;
}
.word-card .bigword {
	margin: 8px 0;
	font: 900 42px "Trebuchet MS", system-ui;
}
.word-card .small {
	font: 800 15px system-ui;
	color: #5b6b8c;
}
.word-card .close-note {
	margin-top: 10px;
	font: 800 13px system-ui;
	color: #7b879c;
}
#celebration {
	position: fixed;
	inset: 0;
	z-index: 15;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .65);
	pointer-events: none;
}
#celebration.show {
	display: grid;
}
#celebration div {
	font: 900 34px "Trebuchet MS", system-ui;
	color: #7dff9d;
	text-shadow: 0 0 18px rgba(125, 255, 157, .6);
	text-align: center;
	padding: 0 20px;
}
.hidden-legacy {
	display: none;
}
#levelModal {
	position: fixed;
	inset: 0;
	z-index: 30;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .82);
	padding: 18px;
}
.level-card {
	width: min(460px, 94vw);
	background: #fffdf5;
	color: #202452;
	border: 6px solid #7c5cff;
	border-radius: 28px;
	padding: 24px;
	text-align: center;
}
.level-card .controls {
	display: flex;
	justify-content: center;
	gap: 10px;
	flex-wrap: wrap;
	margin-top: 14px;
}
.level-card button {
	min-height: 50px;
	padding: 10px 18px;
	border: 3px solid #202452;
	border-radius: 16px;
	background: #ffd166;
	font: 900 16px system-ui;
	cursor: pointer;
}
</style>
</head>
<body>
<canvas id="game" aria-label="Shoot the correct letters"></canvas>

<div id="hud">
	<div id="topRow">
		<div class="badge" id="game_mode_badge">🎮 Mode</div>
		<div class="badge" id="level_badge">🏆 Level <span id="level">1</span></div>
		<div class="badge" id="gift_badge">⭐ Stars <span id="stars">0</span></div>
		<div class="badge">💙 <span id="hp">5</span></div>
	</div>
	<div id="wordRow">
		<div id="emoji">🚀</div>
		<div id="word"></div>
	</div>
	<div id="hint"></div>
</div>

<button id="boostBtn" type="button">🚀 Boost</button>
<div id="flash"></div>

<div id="celebration">
	<div>🎉 Well done!<br><span id="celebrationWord"></span></div>
</div>

<div id="wordPop" role="button" tabindex="0" aria-label="Close word card">
	<div class="word-card">
		<div class="small">Listen to the word:</div>
		<div class="bigword" id="popWord">rocket</div>
		<div class="close-note">Tap anywhere to close • closes automatically in 8 seconds</div>
	</div>
</div>

<div id="levelModal">
	<div class="level-card">
		<div class="sparkles">✨ 🏆 ✨</div>
		<h2>Level Up!</h2>
		<p id="levelMessage"></p>
		<article class="level-story" id="levelStory"></article>
		<p id="nextModeMessage"></p>
		<div class="controls">
			<button id="hearLevelStoryBtn" type="button">🔊 Hear This Story</button>
			<button id="game_mode_next" type="button">Start Next Adventure!</button>
		</div>
	</div>
</div>

<div class="hidden-legacy">
	<div id="bar"></div>
	<div id="starTrack"></div>
	<div id="progressNumber"></div>
	<div id="message"></div>
	<div id="speech"></div>
</div>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script>
(function () {
	'use strict';

	const {
		$,
		readProgress,
		saveProgress,
		goTo,
		sounds,
		say,
		spellWord,
		shuffle,
		getLetterPositions,
		getChapterForLevel,
		awardWin,
		closeWordPopup,
	} = RoboCommon;

	let { level, stars } = readProgress();
	const canvas = $("game");
	const ctx = canvas.getContext("2d");
	const PARENT_SETTINGS_KEY = 'roboParentSettings';
	const NORMAL_SPEED = 110;
	const HIGH_SPEED = 330;
	const LETTER_FALL_SPEED = 65;
	const ASTEROID_FALL_SPEED = 95;
	const ASTEROID_SPAWN_INTERVAL = 3.5;
	const BOOST_SECONDS = 3;
	const SHIP_WIDTH = 54;
	const SHIP_HEIGHT = 46;
	const LETTER_RADIUS = 30;
	const ASTEROID_RADIUS = 26;
	const STAR_SPEED = 130;
	const LASER_SPEED = 620;
	const LASER_FIRE_INTERVAL = .35;
	const WORD_POPUP_SECONDS = 8;

	let hp = 5;
	let current = null;
	let letterPositions = [];
	let letterIndex = 0;
	let previousWord = '';
	let fallingLetters = [];
	let asteroids = [];
	let lasers = [];
	let asteroidTimer = 0;
	let laserTimer = 0;
	let shipX = 0;
	let targetShipX = 0;
	let boostUntil = 0;
	let clock = 0;
	let lastTime = null;
	let stars_ = stars;
	let level_ = level;
	let canvasWidth = 0;
	let canvasHeight = 0;
	let starfield = [];
	let gameState = 'playing';
	let isBusy = false;
	let wordPopupTimer = null;
	const keys = { left: false, right: false };

	window.current = null;
	window.starsEl = $('stars');
	window.levelEl = $('level');
	window.bar = $('bar');
	window.starTrack = $('starTrack');
	window.progressNumber = $('progressNumber');
	window.message = $('message');
	window.speech = $('speech');
	window.activeMode = 'spaceship';
	window.wordDeck = [];

	function readParentSettings() {
		try {
			const raw = localStorage.getItem(PARENT_SETTINGS_KEY);
			if (!raw) return { chapterStartLevels: { 1: 1, 2: 2, 3: 5 }, stats: {} };
			const parsed = JSON.parse(raw);
			return {
				chapterStartLevels: parsed.chapterStartLevels || { 1: 1, 2: 2, 3: 5 },
				stats: parsed.stats || {}
			};
		} catch (error) {
			return { chapterStartLevels: { 1: 1, 2: 2, 3: 5 }, stats: {} };
		}
	}

	function saveWordStatistic(word, wasCorrect) {
		try {
			const settings = readParentSettings();
			const item = settings.stats[word] || { correct: 0, attempts: 0, lastPlayed: '' };
			item.attempts += 1;
			if (wasCorrect) item.correct += 1;
			item.lastPlayed = new Date().toISOString().slice(0, 10);
			settings.stats[word] = item;
			localStorage.setItem(PARENT_SETTINGS_KEY, JSON.stringify(settings));
		} catch (error) {
			/* Statistics are optional. */
		}
	}

	function resize() {
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		const previousWidth = canvasWidth;
		canvasWidth = canvas.clientWidth;
		canvasHeight = canvas.clientHeight;
		canvas.width = Math.round(canvasWidth * dpr);
		canvas.height = Math.round(canvasHeight * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

		if (!starfield.length) {
			for (let i = 0; i < 110; i++) {
				starfield.push({
					x: Math.random() * canvasWidth,
					y: Math.random() * canvasHeight,
					r: Math.random() * 1.4 + .6
				});
			}
		} else {
			starfield.forEach((star) => {
				star.x = Math.min(star.x, canvasWidth);
				star.y = Math.min(star.y, canvasHeight);
			});
		}

		shipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, shipX || canvasWidth / 2));
		targetShipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, targetShipX || shipX));

		if (previousWidth && canvasWidth !== previousWidth) {
			fallingLetters.forEach((item) => {
				item.x = Math.min(item.x, canvasWidth - LETTER_RADIUS);
			});
			asteroids.forEach((item) => {
				item.x = Math.min(item.x, canvasWidth - ASTEROID_RADIUS);
			});
		}
	}

	function currentTargetLetter() {
		if (letterIndex >= letterPositions.length) return '';
		return letterPositions[letterIndex].letter.toLowerCase();
	}

	function renderWord() {
		const word = current.word;
		const doneCount = letterIndex;
		let seen = 0;

		$('word').replaceChildren(...[...word].map((letter) => {
			const span = document.createElement('span');

			if (letter === ' ') {
				span.className = 'space';
				span.textContent = ' ';
			} else {
				span.className = seen < doneCount ? 'done' : '';
				span.textContent = letter;
				seen += 1;
			}

			return span;
		}));
	}

	function spawnLetters() {
		const wanted = currentTargetLetter();
		const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('').filter((letter) => letter !== wanted);
		const choices = shuffle([wanted, ...shuffle(alphabet).slice(0, 2)]);
		const positions = shuffle([0, 1, 2]);

		fallingLetters = choices.map((letter, index) => ({
			letter,
			x: (positions[index] + .5) * (canvasWidth / 3),
			y: -40 - positions[index] * 45,
			vy: LETTER_FALL_SPEED
		}));
	}

	function spawnAsteroid(asteroidX, asteroidY) {
		asteroids.push({
			x: Number.isFinite(asteroidX) ? asteroidX : ASTEROID_RADIUS + Math.random() * (canvasWidth - ASTEROID_RADIUS * 2),
			y: Number.isFinite(asteroidY) ? asteroidY : -ASTEROID_RADIUS * 2,
			vy: ASTEROID_FALL_SPEED,
			spin: Math.random() * Math.PI * 2,
			shape: Array.from({ length: 8 }, () => .75 + Math.random() * .45)
		});
	}

	function showTargetWordPopup() {
		clearTimeout(wordPopupTimer);
		$('popWord').textContent = current.word;
		$('wordPop').classList.add('show');
		sounds.hear();
		say(spellWord(current.word));
		wordPopupTimer = setTimeout(closeWordPopup, WORD_POPUP_SECONDS * 1000);
	}

	function startWord() {
		const chapter = getChapterForLevel(level_);
		const words = RoboWords.getWordsByChapter(chapter);
		const pool = words.filter((item) => item.word !== previousWord);
		current = pool[Math.floor(Math.random() * pool.length)] || words[0];
		window.current = current;
		previousWord = current.word;
		letterPositions = getLetterPositions(current.word);
		letterIndex = 0;
		hp = 5;
		boostUntil = 0;
		isBusy = false;
		asteroids = [];
		lasers = [];
		asteroidTimer = 0;
		laserTimer = 0;
		gameState = 'playing';

		$('emoji').textContent = current.emoji;
		$('hint').textContent = current.clue + ' Find ' + currentTargetLetter().toUpperCase();
		$('hp').textContent = hp;
		renderWord();
		spawnLetters();
		showTargetWordPopup();
	}

	function damageShip() {
		sounds.wrong();
		hp = Math.max(0, hp - 1);
		$('hp').textContent = hp;
		$('flash').classList.add('on');
		setTimeout(() => $('flash').classList.remove('on'), 180);

		if (hp === 0) {
			isBusy = true;
			fallingLetters = [];
			asteroids = [];
			lasers = [];
			$('hint').textContent = 'Try this word again.';
			say('Try this word again. The word is ' + spellWord(current.word));
			setTimeout(startWord, 1500);
		}
	}

	function completeWord() {
		isBusy = true;
		fallingLetters = [];
		asteroids = [];
		lasers = [];
		gameState = 'enteringBase';
		$('hint').textContent = 'Returning to the Super Space Base!';
		say('Well done! ' + current.word + '. Returning to the Super Space Base.');
	}

	function collectLetter(item) {
		if (isBusy || gameState !== 'playing') return;

		const wanted = currentTargetLetter();

		if (item.letter === wanted) {
			sounds.win();
			saveWordStatistic(current.word, true);
			boostUntil = clock + BOOST_SECONDS;
			letterIndex += 1;
			renderWord();

			if (letterIndex >= letterPositions.length) {
				completeWord();
				return;
			}

			$('hint').textContent = 'Great! Find ' + currentTargetLetter().toUpperCase();
			spawnLetters();
		} else {
			saveWordStatistic(current.word, false);
			damageShip();

			if (!isBusy) {
				$('hint').textContent = 'Try again. Find ' + wanted.toUpperCase();
				say('Try again. Find ' + wanted);
			}
		}
	}

	function fireLaser() {
		if (gameState !== 'playing') return;
		sounds.click();
		lasers.push({ x: shipX, y: canvasHeight - 115 });
	}

	function update(dt) {
		const boosting = clock < boostUntil;
		const speed = boosting ? HIGH_SPEED : NORMAL_SPEED;

		$('boostBtn').classList.toggle('active', boosting);

		if (keys.left) targetShipX -= speed * dt;
		if (keys.right) targetShipX += speed * dt;

		targetShipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, targetShipX));
		shipX += (targetShipX - shipX) * Math.min(1, dt * (boosting ? 16 : 10));
		shipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, shipX));

		const starSpeed = STAR_SPEED * (boosting ? 3 : 1);
		starfield.forEach((star) => {
			star.y += starSpeed * dt;
			if (star.y > canvasHeight) {
				star.y = -4;
				star.x = Math.random() * canvasWidth;
			}
		});

		if (gameState === 'enteringBase') {
			const baseX = canvasWidth - 95;
			const baseY = canvasHeight - 170;
			const dx = baseX - shipX;
			const dy = baseY - (canvasHeight - 90);
			const distance = Math.hypot(dx, dy);

			if (distance < 12) {
				gameState = 'awarding';
				awardWin(current.word);
			} else {
				shipX += (dx / distance) * 220 * dt;
			}

			return;
		}

		if (gameState !== 'playing') return;

		$('boostBtn').classList.toggle('active', boosting);

		if (!isBusy) {
			laserTimer += dt;
			if (laserTimer >= LASER_FIRE_INTERVAL) {
				laserTimer = 0;
				fireLaser();
			}

			asteroidTimer += dt;
			if (asteroidTimer >= ASTEROID_SPAWN_INTERVAL) {
				asteroidTimer = 0;
				spawnAsteroid();
			}

			lasers.forEach((laser) => {
				laser.y -= LASER_SPEED * dt;

				fallingLetters.forEach((item) => {
					if (item.collected) return;
					if (Math.abs(laser.x - item.x) < LETTER_RADIUS && Math.abs(laser.y - item.y) < LETTER_RADIUS) {
						item.collected = true;
						laser.hit = true;
						collectLetter(item);
					}
				});

				asteroids.forEach((item) => {
					if (item.hit) return;
					if (Math.abs(laser.x - item.x) < ASTEROID_RADIUS && Math.abs(laser.y - item.y) < ASTEROID_RADIUS) {
						item.hit = true;
						laser.hit = true;
						sounds.pop();
					}
				});
			});

			lasers = lasers.filter((laser) => !laser.hit && laser.y > -20);
			asteroids = asteroids.filter((item) => !item.hit && item.y < canvasHeight + ASTEROID_RADIUS * 2);
			fallingLetters = fallingLetters.filter((item) => !item.collected && item.y < canvasHeight + 60);

			asteroids.forEach((item) => {
				item.y += item.vy * dt;
				item.spin += dt;
			});

			fallingLetters.forEach((item) => {
				item.y += item.vy * dt;
			});

			if (!fallingLetters.length && letterIndex < letterPositions.length) {
				spawnLetters();
			}
		}
	}

	function draw() {
		const boosting = clock < boostUntil;
		const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
		gradient.addColorStop(0, '#050914');
		gradient.addColorStop(1, boosting ? '#123a63' : '#101a33');

		ctx.fillStyle = gradient;
		ctx.fillRect(0, 0, canvasWidth, canvasHeight);

		ctx.fillStyle = '#cfe6ff';
		starfield.forEach((star) => {
			ctx.globalAlpha = boosting ? .95 : .65;
			ctx.beginPath();
			ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
			ctx.fill();
		});
		ctx.globalAlpha = 1;

		if (gameState === 'enteringBase' || gameState === 'awarding') {
			const baseX = canvasWidth - 95;
			const baseY = canvasHeight - 170;

			ctx.fillStyle = '#1d2c55';
			ctx.strokeStyle = '#64e0ff';
			ctx.lineWidth = 4;
			ctx.beginPath();
			ctx.arc(baseX, baseY, 62, 0, Math.PI * 2);
			ctx.fill();
			ctx.stroke();

			ctx.fillStyle = '#7dff9d';
			ctx.font = '900 16px system-ui';
			ctx.textAlign = 'center';
			ctx.fillText('SUPER SPACE BASE', baseX, baseY + 92);
		}

		asteroids.forEach((item) => {
			ctx.save();
			ctx.translate(item.x, item.y);
			ctx.rotate(item.spin);
			ctx.fillStyle = '#4b4438';
			ctx.strokeStyle = '#8a7a5e';
			ctx.lineWidth = 3;
			ctx.beginPath();
			item.shape.forEach((scale, index) => {
				const angle = (index / item.shape.length) * Math.PI * 2;
				const x = Math.cos(angle) * ASTEROID_RADIUS * scale;
				const y = Math.sin(angle) * ASTEROID_RADIUS * scale;
				if (index === 0) ctx.moveTo(x, y);
				else ctx.lineTo(x, y);
			});
			ctx.closePath();
			ctx.fill();
			ctx.stroke();
			ctx.restore();
		});

		fallingLetters.forEach((item) => {
			ctx.fillStyle = '#182c52';
			ctx.strokeStyle = '#64e0ff';
			ctx.lineWidth = 3;
			ctx.beginPath();
			ctx.arc(item.x, item.y, LETTER_RADIUS, 0, Math.PI * 2);
			ctx.fill();
			ctx.stroke();

			ctx.fillStyle = '#eaf2ff';
			ctx.font = '900 34px system-ui';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(item.letter.toUpperCase(), item.x, item.y + 2);
		});

		lasers.forEach((laser) => {
			ctx.strokeStyle = '#7dff9d';
			ctx.lineWidth = 5;
			ctx.beginPath();
			ctx.moveTo(laser.x, laser.y);
			ctx.lineTo(laser.x, laser.y + 26);
			ctx.stroke();
		});

		const shipY = canvasHeight - 90;
		ctx.save();
		ctx.translate(shipX, shipY);

		if (clock < boostUntil) {
			ctx.fillStyle = '#64e0ff';
			ctx.beginPath();
			ctx.moveTo(-10, SHIP_HEIGHT / 2);
			ctx.lineTo(10, SHIP_HEIGHT / 2);
			ctx.lineTo(0, SHIP_HEIGHT / 2 + 38 + Math.random() * 14);
			ctx.closePath();
			ctx.fill();
		}

		ctx.fillStyle = '#d9f6ff';
		ctx.strokeStyle = '#64e0ff';
		ctx.lineWidth = 3;
		ctx.beginPath();
		ctx.moveTo(0, -SHIP_HEIGHT / 2);
		ctx.lineTo(SHIP_WIDTH / 2, SHIP_HEIGHT / 2);
		ctx.lineTo(-SHIP_WIDTH / 2, SHIP_HEIGHT / 2);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		ctx.fillStyle = '#0a1f3d';
		ctx.beginPath();
		ctx.arc(0, -4, 8, 0, Math.PI * 2);
		ctx.fill();
		ctx.restore();
	}

	function frame(time) {
		if (lastTime === null) lastTime = time;
		const dt = Math.min((time - lastTime) / 1000, .05);
		lastTime = time;
		clock += dt;

		update(dt);
		draw();
		requestAnimationFrame(frame);
	}

	function moveShip(clientX) {
		targetShipX = clientX;
	}

	canvas.addEventListener('pointermove', (event) => moveShip(event.clientX));
	canvas.addEventListener('pointerdown', (event) => moveShip(event.clientX));

	$('boostBtn').addEventListener('click', () => {
		sounds.click();
		boostUntil = Math.max(boostUntil, clock + BOOST_SECONDS);
	});

	$('game_mode_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./game_mode.html', level_, stars_);
	});

	$('level_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./story.html', level_, stars_);
	});

	$('gift_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./gift.html', level_, stars_);
	});

	$('wordPop').addEventListener('click', () => {
		clearTimeout(wordPopupTimer);
		closeWordPopup();
	});

	$('wordPop').addEventListener('keydown', (event) => {
		if (event.key === 'Enter' || event.key === ' ') {
			clearTimeout(wordPopupTimer);
			closeWordPopup();
		}
	});

	document.addEventListener('keydown', (event) => {
		if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
			keys.left = true;
			event.preventDefault();
		}
		if (event.code === 'ArrowRight' || event.code === 'KeyD') {
			keys.right = true;
			event.preventDefault();
		}
		if (event.code === 'Space' || event.code === 'ArrowUp') {
			event.preventDefault();
		}
	});

	document.addEventListener('keyup', (event) => {
		if (event.code === 'ArrowLeft' || event.code === 'KeyA') keys.left = false;
		if (event.code === 'ArrowRight' || event.code === 'KeyD') keys.right = false;
	});

	window.addEventListener('resize', resize);
	window.addEventListener('orientationchange', () => setTimeout(resize, 120));
	resize();

	$('level').textContent = level_;
	$('stars').textContent = stars_;
	shipX = canvasWidth / 2;
	targetShipX = shipX;
	startWord();
	requestAnimationFrame(frame);

	window.RoboSpaceship = {
		fireLaser,
		spawnAsteroid,
		getState: () => ({
			hp,
			clock,
			boostUntil,
			shipX,
			lasers: lasers.length,
			asteroids: asteroids.length,
			letterIndex,
			state: gameState,
			word: current ? current.word : ''
		})
	};
})();
</script>
</body>
</html>
