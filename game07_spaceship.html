<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050914">
<title>Robo-Monster Spelling Academy</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
html, body {
	height: 100%;
	margin: 0;
	overflow: hidden;
	background: #050914;
	color: #eaf2ff;
	font-family: "Trebuchet MS", system-ui, sans-serif;
	overscroll-behavior: none;
}
#game {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	touch-action: none;
}
#hud {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 2;
	padding: 10px 12px;
	pointer-events: none;
}
#topRow {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
}
.badge {
	padding: 7px 10px;
	border: 2px solid #3d5a99;
	border-radius: 999px;
	background: rgba(9, 16, 34, .82);
	font: 800 14px system-ui;
	white-space: nowrap;
	pointer-events: auto;
	cursor: pointer;
}
#wordRow {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	margin-top: 8px;
}
#emoji {
	font-size: 30px;
}
#word {
	display: flex;
	gap: 4px;
	font: 900 28px system-ui;
	letter-spacing: 2px;
}
#word span {
	min-width: 22px;
	text-align: center;
	color: #7fd4ff;
}
#word span.done {
	color: #7dff9d;
}
#word span.space {
	min-width: 14px;
}
#hint {
	margin-top: 6px;
	text-align: center;
	font: 800 15px system-ui;
	color: #b9c9ee;
	min-height: 20px;
}
#flash {
	position: fixed;
	inset: 0;
	z-index: 4;
	pointer-events: none;
	background: rgba(255, 70, 70, .22);
	opacity: 0;
	transition: opacity .18s;
}
#flash.on {
	opacity: 1;
}
#wordPop {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .55);
	padding: 18px;
}
#wordPop.show {
	display: grid;
}
.word-card {
	position: relative;
	width: min(440px, 94vw);
	background: #fffdf5;
	color: #202452;
	border: 5px solid #64e0ff;
	border-radius: 26px;
	padding: 22px;
	text-align: center;
}
.word-card .bigword {
	margin: 8px 0;
	font: 900 42px "Trebuchet MS", system-ui;
}
.word-card .small {
	font: 800 15px system-ui;
	color: #5b6b8c;
}
.word-card .close-note {
	margin-top: 10px;
	font: 800 13px system-ui;
	color: #7b879c;
}
#popClose {
	position: absolute;
	top: 10px;
	right: 10px;
	width: 44px;
	height: 44px;
	border: 3px solid #202452;
	border-radius: 999px;
	background: #ffd166;
	font: 900 20px system-ui;
	color: #202452;
	cursor: pointer;
}
#celebration {
	position: fixed;
	inset: 0;
	z-index: 15;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .55);
	pointer-events: none;
}
#celebration.show {
	display: grid;
}
#celebration div {
	font: 900 40px "Trebuchet MS", system-ui;
	color: #7dff9d;
	text-shadow: 0 0 22px rgba(125, 255, 157, .7);
	text-align: center;
	padding: 0 20px;
	animation: popIn .5s ease-out;
}
@keyframes popIn {
	0% { transform: scale(.4); opacity: 0; }
	60% { transform: scale(1.15); opacity: 1; }
	100% { transform: scale(1); opacity: 1; }
}
.hidden-legacy {
	display: none;
}
#levelModal {
	position: fixed;
	inset: 0;
	z-index: 30;
	display: none;
	place-items: center;
	background: rgba(3, 8, 20, .82);
	padding: 18px;
}
.level-card {
	width: min(460px, 94vw);
	background: #fffdf5;
	color: #202452;
	border: 6px solid #7c5cff;
	border-radius: 28px;
	padding: 24px;
	text-align: center;
}
.level-card .controls {
	display: flex;
	justify-content: center;
	gap: 10px;
	flex-wrap: wrap;
	margin-top: 14px;
}
.level-card button {
	min-height: 50px;
	padding: 10px 18px;
	border: 3px solid #202452;
	border-radius: 16px;
	background: #ffd166;
	font: 900 16px system-ui;
	cursor: pointer;
}
</style>
</head>
<body>
<canvas id="game" aria-label="Shoot the correct letters"></canvas>

<div id="hud">
	<div id="topRow">
		<div class="badge" id="game_mode_badge">🎮 Mode</div>
		<div class="badge" id="level_badge">🏆 Level <span id="level">1</span></div>
		<div class="badge" id="gift_badge">⭐ Stars <span id="stars">0</span></div>
		<div class="badge">💙 <span id="hp">5</span></div>
	</div>
	<div id="wordRow">
		<div id="emoji">🚀</div>
		<div id="word"></div>
	</div>
	<div id="hint"></div>
</div>

<div id="flash"></div>

<div id="celebration">
	<div id="celebrationText">🎉 Well done!</div>
</div>

<div id="wordPop" role="button" tabindex="0" aria-label="Close word card">
	<div class="word-card">
		<button id="popClose" type="button" aria-label="Close">✕</button>
		<div class="small">Listen to the word:</div>
		<div class="bigword" id="popWord">rocket</div>
		<div class="close-note">Tap anywhere to close • closes automatically in 8 seconds</div>
	</div>
</div>

<div id="levelModal">
	<div class="level-card">
		<div class="sparkles">✨ 🏆 ✨</div>
		<h2>Level Up!</h2>
		<p id="levelMessage"></p>
		<article class="level-story" id="levelStory"></article>
		<p id="nextModeMessage"></p>
		<div class="controls">
			<button id="hearLevelStoryBtn" type="button">🔊 Hear This Story</button>
			<button id="game_mode_next" type="button">Start Next Adventure!</button>
		</div>
	</div>
</div>

<div class="hidden-legacy">
	<div id="bar"></div>
	<div id="starTrack"></div>
	<div id="progressNumber"></div>
	<div id="message"></div>
	<div id="speech"></div>
</div>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script>
(function () {
	'use strict';

	// Safe access to shared utilities. On some iPad Safari versions the
	// shared script may load partially, so every helper has a local fallback.
	const RC = window.RoboCommon || {};

	const $ = RC.$ || function (id) {
		return document.getElementById(id);
	};

	const STORAGE_KEY = 'roboMonsterProgress';

	const readProgress = RC.readProgress || function () {
		let saved = { level: 1, stars: 0 };
		try {
			const raw = localStorage.getItem(STORAGE_KEY);
			if (raw) {
				const parsed = JSON.parse(raw);
				if (Number.isFinite(parsed.level) && parsed.level >= 1) saved.level = Math.floor(parsed.level);
				if (Number.isFinite(parsed.stars) && parsed.stars >= 0) saved.stars = Math.floor(parsed.stars);
			}
		} catch (error) {
			/* Ignore unavailable storage. */
		}
		return saved;
	};

	const saveProgress = RC.saveProgress || function (level, stars) {
		try {
			localStorage.setItem(STORAGE_KEY, JSON.stringify({
				level: Math.max(1, Math.floor(level)),
				stars: Math.max(0, Math.floor(stars))
			}));
		} catch (error) {
			/* Storage is optional. */
		}
	};

	const goTo = RC.goTo || function (path, level, stars) {
		window.location.assign(path + '?level=' + level + '&stars=' + stars);
	};

	const silence = function () {};
	const sounds = RC.sounds || {
		click: silence,
		undo: silence,
		hear: silence,
		wrong: silence,
		win: silence,
		level: silence,
		pop: silence,
		star: silence,
		sticker: silence
	};

	const say = RC.say || function (text) {
		try {
			if (!('speechSynthesis' in window)) return;
			window.speechSynthesis.cancel();
			const utterance = new SpeechSynthesisUtterance(text);
			utterance.lang = 'en-GB';
			utterance.rate = 0.82;
			window.speechSynthesis.speak(utterance);
		} catch (error) {
			/* Speech is optional. */
		}
	};

	const spellWord = RC.spellWord || function (word) {
		return word + '. ' + word.split('').join('-') + ' . ' + word + '. ';
	};

	const shuffle = RC.shuffle || function (items) {
		const copy = items.slice();
		for (let i = copy.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			const temp = copy[i];
			copy[i] = copy[j];
			copy[j] = temp;
		}
		return copy;
	};

	const getLetterPositions = RC.getLetterPositions || function (word) {
		return String(word)
			.split('')
			.map(function (letter, index) {
				return { letter: letter, index: index };
			})
			.filter(function (item) {
				return item.letter !== ' ';
			});
	};

	const getChapterForLevel = RC.getChapterForLevel || function (level) {
		const currentLevel = Math.max(1, Math.floor(Number(level) || 1));
		if (currentLevel >= 5) return 3;
		if (currentLevel >= 2) return 2;
		return 1;
	};

	const awardWin = RC.awardWin || function () {};

	// Local close function: does not depend on RoboCommon's timer state.
	function closeWordPopupNow() {
		clearTimeout(wordPopupTimer);
		$('wordPop').classList.remove('show');
	}

	const closeWordPopup = RC.closeWordPopup || closeWordPopupNow;

	let { level, stars } = readProgress();
	const canvas = $("game");
	const ctx = canvas.getContext("2d");
	const PARENT_SETTINGS_KEY = 'roboParentSettings';
	const LANE_COUNT = 6;
	const NORMAL_SPEED = 110;
	const HIGH_SPEED = 330;
	const LETTER_FALL_SPEED = 65;
	const ASTEROID_FALL_SPEED = 95;
	const ASTEROID_SPAWN_INTERVAL = 3.5;
	const BOOST_SECONDS = 3;
	const SHIP_WIDTH = 54;
	const SHIP_HEIGHT = 46;
	const LETTER_RADIUS = 30;
	const ASTEROID_RADIUS = 26;
	const STAR_SPEED = 130;
	const LASER_SPEED = 310;
	const LASER_FIRE_INTERVAL = .35;
	const LASER_MIN_Y = 240;
	const WORD_POPUP_SECONDS = 8;
	const DOCK_SPEED = 2600;
	const NEXT_WORD_DELAY = 1800;
	const LEVEL_UP_AWARD_DELAY = 3000;

	// Fallback words used if the word library fails to load on a device.
	const FALLBACK_WORDS = [
		{ word: 'rocket', emoji: '🚀', clue: 'It flies to space.' },
		{ word: 'star', emoji: '⭐', clue: 'It shines in the sky.' },
		{ word: 'moon', emoji: '🌙', clue: 'It lights the night.' },
		{ word: 'ship', emoji: '🚢', clue: 'It sails on water.' },
		{ word: 'robot', emoji: '🤖', clue: 'It is a machine friend.' }
	];

	function getWordPool() {
		try {
			const chapter = getChapterForLevel(level_);
			const words = RoboWords.getWordsByChapter(chapter);
			if (Array.isArray(words) && words.length) return words;
		} catch (error) {
			/* Fall through to the fallback list. */
		}
		return FALLBACK_WORDS;
	}

	let hp = 5;
	let current = null;
	let letterPositions = [];
	let letterIndex = 0;
	let previousWord = '';
	let fallingLetters = [];
	let asteroids = [];
	let lasers = [];
	let asteroidTimer = 0;
	let laserTimer = 0;
	let shipX = 0;
	let shipY = 0;
	let targetShipX = 0;
	let boostUntil = 0;
	let clock = 0;
	let lastTime = null;
	let stars_ = stars;
	let level_ = level;
	let canvasWidth = 0;
	let canvasHeight = 0;
	let starfield = [];
	let gameState = 'playing';
	let isBusy = false;
	let wordPopupTimer = null;
	let celebrationTimer = null;
	let nextWordTimer = null;
	let levelUpAwardTimer = null;
	let wordLaneParity = 0;
	let levelUpFlight = false;
	let pointerBoostActive = false;
	const keys = { left: false, right: false };

	window.current = null;
	window.starsEl = $('stars');
	window.levelEl = $('level');
	window.bar = $('bar');
	window.starTrack = $('starTrack');
	window.progressNumber = $('progressNumber');
	window.message = $('message');
	window.speech = $('speech');
	window.activeMode = 'spaceship';
	window.wordDeck = [];
	window.stars = stars_;
	window.level = level_;

	function showStartupError(error) {
		try {
			$('hint').textContent = 'Startup issue: ' + (error && error.message ? error.message : error);
		} catch (ignored) {
			/* Hint element may be unavailable. */
		}
	}

	// Safari-compatible rounded rectangle path (ctx.roundRect is unavailable
	// in older Safari versions and would throw during draw).
	function roundRectPath(c, x, y, w, h, r) {
		c.beginPath();
		c.moveTo(x + r, y);
		c.lineTo(x + w - r, y);
		c.arcTo(x + w, y, x + w, y + r, r);
		c.lineTo(x + w, y + h - r);
		c.arcTo(x + w, y + h, x + w - r, y + h, r);
		c.lineTo(x + r, y + h);
		c.arcTo(x, y + h, x, y + h - r, r);
		c.lineTo(x, y + r);
		c.arcTo(x, y, x + r, y, r);
		c.closePath();
	}

	function readParentSettings() {
		try {
			const raw = localStorage.getItem(PARENT_SETTINGS_KEY);
			if (!raw) return { chapterStartLevels: { 1: 1, 2: 2, 3: 5 }, stats: {} };
			const parsed = JSON.parse(raw);
			return {
				chapterStartLevels: parsed.chapterStartLevels || { 1: 1, 2: 2, 3: 5 },
				stats: parsed.stats || {}
			};
		} catch (error) {
			return { chapterStartLevels: { 1: 1, 2: 2, 3: 5 }, stats: {} };
		}
	}

	function saveWordStatistic(word, wasCorrect) {
		try {
			const settings = readParentSettings();
			const item = settings.stats[word] || { correct: 0, attempts: 0, lastPlayed: '' };
			item.attempts += 1;
			if (wasCorrect) item.correct += 1;
			item.lastPlayed = new Date().toISOString().slice(0, 10);
			settings.stats[word] = item;
			localStorage.setItem(PARENT_SETTINGS_KEY, JSON.stringify(settings));
		} catch (error) {
			/* Statistics are optional. */
		}
	}

	function resize() {
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		const previousWidth = canvasWidth;
		canvasWidth = canvas.clientWidth;
		canvasHeight = canvas.clientHeight;
		canvas.width = Math.round(canvasWidth * dpr);
		canvas.height = Math.round(canvasHeight * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

		if (!starfield.length) {
			for (let i = 0; i < 110; i++) {
				starfield.push({
					x: Math.random() * canvasWidth,
					y: Math.random() * canvasHeight,
					r: Math.random() * 1.4 + .6
				});
			}
		} else {
			starfield.forEach((star) => {
				star.x = Math.min(star.x, canvasWidth);
				star.y = Math.min(star.y, canvasHeight);
			});
		}

		// Start between lane 0 and lane 1 so the ship is not aligned with a letter lane.
		shipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, shipX || canvasWidth / 6));
		targetShipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, targetShipX || shipX));
		shipY = canvasHeight - 90;

		if (previousWidth && canvasWidth !== previousWidth) {
			fallingLetters.forEach((item) => {
				item.x = Math.min(item.x, canvasWidth - LETTER_RADIUS);
			});
			asteroids.forEach((item) => {
				item.x = Math.min(item.x, canvasWidth - ASTEROID_RADIUS);
			});
		}
	}

	function currentTargetLetter() {
		if (letterIndex >= letterPositions.length) return '';
		return letterPositions[letterIndex].letter.toLowerCase();
	}

	function renderWord() {
		const word = current.word;
		const doneCount = letterIndex;
		let seen = 0;

		$('word').replaceChildren(...[...word].map((letter) => {
			const span = document.createElement('span');

			if (letter === ' ') {
				span.className = 'space';
				span.textContent = ' ';
			} else {
				span.className = seen < doneCount ? 'done' : '';
				span.textContent = letter;
				seen += 1;
			}

			return span;
		}));
	}

	function spawnLetters() {
		const wanted = currentTargetLetter();
		const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('').filter((letter) => letter !== wanted);
		const choices = shuffle([wanted, ...shuffle(alphabet).slice(0, 2)]);

		// Alternate between even lanes (0,2,4) and odd lanes (1,3,5) for each word,
		// so the next word's letters never line up with the ship's previous lane.
		const laneSet = wordLaneParity === 0 ? [0, 2, 4] : [1, 3, 5];
		const lanes = shuffle(laneSet);

		// Letters start above the top edge and fall into view.
		fallingLetters = choices.map((letter, index) => ({
			letter,
			x: (lanes[index] + .5) * (canvasWidth / LANE_COUNT),
			y: 40 - index * 50,
			vy: LETTER_FALL_SPEED
		}));
	}

	function spawnAsteroid(asteroidX, asteroidY) {
		asteroids.push({
			x: Number.isFinite(asteroidX) ? asteroidX : ASTEROID_RADIUS + Math.random() * (canvasWidth - ASTEROID_RADIUS * 2),
			y: Number.isFinite(asteroidY) ? asteroidY : 320,
			vy: ASTEROID_FALL_SPEED,
			spin: Math.random() * Math.PI * 2,
			shape: Array.from({ length: 8 }, () => .75 + Math.random() * .45)
		});
	}

	function showTargetWordPopup() {
		clearTimeout(wordPopupTimer);
		$('popWord').textContent = current.word;
		$('wordPop').classList.add('show');
		sounds.hear();
		say(spellWord(current.word));
		wordPopupTimer = setTimeout(closeWordPopupNow, WORD_POPUP_SECONDS * 1000);
	}

	function startWord() {
		try {
			const words = getWordPool();
			const pool = words.filter((item) => item.word !== previousWord);
			current = pool[Math.floor(Math.random() * pool.length)] || words[0];
			window.current = current;
			previousWord = current.word;
			letterPositions = getLetterPositions(current.word);
			letterIndex = 0;
			hp = 5;
			boostUntil = 0;
			isBusy = false;
			asteroids = [];
			lasers = [];
			asteroidTimer = 0;
			laserTimer = 0;
			gameState = 'playing';
			shipY = canvasHeight - 90;

			// Alternate lane parity for each new word.
			wordLaneParity = 1 - wordLaneParity;

			$('emoji').textContent = current.emoji;
			$('hint').textContent = current.clue + ' Find ' + currentTargetLetter().toUpperCase();
			$('hp').textContent = hp;
			renderWord();
			spawnLetters();
			showTargetWordPopup();
		} catch (error) {
			showStartupError(error);
		}
	}

	function damageShip() {
		sounds.wrong();
		hp = Math.max(0, hp - 1);
		$('hp').textContent = hp;
		$('flash').classList.add('on');
		setTimeout(() => $('flash').classList.remove('on'), 180);

		if (hp === 0) {
			isBusy = true;
			fallingLetters = [];
			asteroids = [];
			lasers = [];
			$('hint').textContent = 'Try this word again.';
			say('Try this word again. The word is ' + spellWord(current.word));
			setTimeout(startWord, 1500);
		}
	}

	function completeWord() {
		isBusy = true;
		fallingLetters = [];
		asteroids = [];
		lasers = [];
		gameState = 'enteringBase';

		const willLevelUp = (stars_ + 1) % 3 === 0;
		levelUpFlight = willLevelUp;
		clearTimeout(celebrationTimer);
		clearTimeout(levelUpAwardTimer);

		if (willLevelUp) {
			$('celebrationText').textContent = '🎉 Level Up!';
			$('celebration').classList.add('show');
			sounds.level();
			say('Level up! Well done! ' + current.word + '.');

			// Base appears now; awardWin (Sticker Popup + showLevelUp) fires after 3 seconds.
			levelUpAwardTimer = setTimeout(() => {
				try {
					awardWin(current.word);
				} catch (error) {
					showStartupError(error);
				}

				const progress = readProgress();
				stars_ = progress.stars;
				level_ = progress.level;
				window.stars = stars_;
				window.level = level_;
				$('stars').textContent = stars_;
				$('level').textContent = level_;
			}, LEVEL_UP_AWARD_DELAY);
		} else {
			$('celebrationText').textContent = '🎉 Well done!';
			$('celebration').classList.add('show');
			sounds.win();
			say('Well done! ' + current.word + '.');

			// Non-level-up wins award immediately; no base is shown.
			try {
				awardWin(current.word);
			} catch (error) {
				showStartupError(error);
			}

			const progress = readProgress();
			stars_ = progress.stars;
			level_ = progress.level;
			window.stars = stars_;
			window.level = level_;
			$('stars').textContent = stars_;
			$('level').textContent = level_;

			clearTimeout(nextWordTimer);
			nextWordTimer = setTimeout(startWord, NEXT_WORD_DELAY);
		}

		$('hint').textContent = 'Well done!';

		celebrationTimer = setTimeout(() => {
			$('celebration').classList.remove('show');
		}, 2600);
	}

	function collectLetter(item) {
		if (isBusy || gameState !== 'playing') return;

		// Hitting any letter ends the boost immediately.
		boostUntil = 0;

		const wanted = currentTargetLetter();

		if (item.letter === wanted) {
			sounds.win();
			saveWordStatistic(current.word, true);
			letterIndex += 1;
			renderWord();

			if (letterIndex >= letterPositions.length) {
				completeWord();
				return;
			}

			$('hint').textContent = 'Great! Find ' + currentTargetLetter().toUpperCase();
			spawnLetters();
		} else {
			saveWordStatistic(current.word, false);
			damageShip();

			if (!isBusy) {
				$('hint').textContent = 'Try again. Find ' + wanted.toUpperCase();
				say('Try again. Find ' + wanted);
			}
		}
	}

	function fireLaser() {
		if (gameState !== 'playing') return;

		const startY = shipY - 25;
		// Laser range is half of the previous full travel distance,
		// and doubles while boosting.
		const boosting = clock < boostUntil;
		const range = ((startY - LASER_MIN_Y) / 2) * (boosting ? 2 : 1);

		lasers.push({ x: shipX, y: startY, startY, range });
	}

	function activateBoost() {
		if (gameState !== 'playing') return;
		sounds.click();
		boostUntil = Math.max(boostUntil, clock + BOOST_SECONDS);
	}

	function update(dt) {
		const boosting = clock < boostUntil;
		const speed = boosting ? HIGH_SPEED : NORMAL_SPEED;

		// User control is locked once the word is won.
		if (gameState === 'playing') {
			if (keys.left) targetShipX -= speed * dt;
			if (keys.right) targetShipX += speed * dt;

			targetShipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, targetShipX));
			shipX += (targetShipX - shipX) * Math.min(1, dt * (boosting ? 16 : 10));
			shipX = Math.max(SHIP_WIDTH / 2, Math.min(canvasWidth - SHIP_WIDTH / 2, shipX));
		}

		const starSpeed = STAR_SPEED * (boosting ? 3 : 1);
		starfield.forEach((star) => {
			star.y += starSpeed * dt;
			if (star.y > canvasHeight) {
				star.y = -4;
				star.x = Math.random() * canvasWidth;
			}
		});

		if (gameState === 'enteringBase') {
			// Fly to the base as a celebration animation; the award is on its own timer.
			const dockX = canvasWidth / 2;
			const dockY = 300;
			const dx = dockX - shipX;
			const dy = dockY - shipY;
			const distance = Math.hypot(dx, dy);
			const step = Math.min(distance, DOCK_SPEED * dt);

			if (step >= distance) {
				gameState = 'docked';
				shipX = dockX;
				shipY = dockY;
			} else {
				shipX += (dx / distance) * step;
				shipY += (dy / distance) * step;
			}

			return;
		}

		if (gameState !== 'playing') return;

		if (!isBusy) {
			laserTimer += dt;
			if (laserTimer >= LASER_FIRE_INTERVAL) {
				laserTimer = 0;
				fireLaser();
			}

			asteroidTimer += dt;
			if (asteroidTimer >= ASTEROID_SPAWN_INTERVAL) {
				asteroidTimer = 0;
				spawnAsteroid();
			}

			lasers.forEach((laser) => {
				laser.y -= LASER_SPEED * dt;

				fallingLetters.forEach((item) => {
					if (item.collected) return;
					if (Math.abs(laser.x - item.x) < LETTER_RADIUS && Math.abs(laser.y - item.y) < LETTER_RADIUS) {
						item.collected = true;
						laser.hit = true;
						collectLetter(item);
					}
				});

				asteroids.forEach((item) => {
					if (item.hit) return;
					if (Math.abs(laser.x - item.x) < ASTEROID_RADIUS && Math.abs(laser.y - item.y) < ASTEROID_RADIUS) {
						item.hit = true;
						laser.hit = true;
						sounds.pop();
					}
				});
			});

			// Remove lasers once they have travelled their range.
			lasers = lasers.filter((laser) => !laser.hit && (laser.startY - laser.y) < laser.range);
			asteroids = asteroids.filter((item) => !item.hit && item.y < canvasHeight + ASTEROID_RADIUS * 2);
			fallingLetters = fallingLetters.filter((item) => !item.collected && item.y < canvasHeight + 60);

			asteroids.forEach((item) => {
				item.y += item.vy * dt;
				item.spin += dt;
			});

			// Letters fall six times as fast while boosting.
			fallingLetters.forEach((item) => {
				item.y += item.vy * (boosting ? 6 : 1) * dt;
			});

			if (!fallingLetters.length && letterIndex < letterPositions.length) {
				spawnLetters();
			}
		}
	}

	function drawSpaceBase() {
		const x = canvasWidth / 2;
		const y = 170;
		const scale = 1.6;

		ctx.save();
		ctx.translate(x, y);
		ctx.scale(scale, scale);

		const glow = ctx.createRadialGradient(0, 0, 20, 0, 0, 150);
		glow.addColorStop(0, 'rgba(100, 224, 255, .30)');
		glow.addColorStop(1, 'rgba(100, 224, 255, 0)');
		ctx.fillStyle = glow;
		ctx.beginPath();
		ctx.arc(0, 0, 150, 0, Math.PI * 2);
		ctx.fill();

		ctx.fillStyle = '#16345f';
		ctx.strokeStyle = '#64e0ff';
		ctx.lineWidth = 3;
		[-125, 125].forEach((offset) => {
			roundRectPath(ctx, offset - 52, -22, 104, 44, 8);
			ctx.fill();
			ctx.stroke();
		});

		ctx.strokeStyle = 'rgba(100, 224, 255, .55)';
		ctx.lineWidth = 2;
		[-125, 125].forEach((offset) => {
			for (let i = 1; i < 5; i++) {
				ctx.beginPath();
				ctx.moveTo(offset - 52 + i * 21, -22);
				ctx.lineTo(offset - 52 + i * 21, 22);
				ctx.stroke();
			}
		});

		ctx.strokeStyle = '#7f9dd6';
		ctx.lineWidth = 10;
		ctx.beginPath();
		ctx.moveTo(-85, 0);
		ctx.lineTo(-38, 0);
		ctx.moveTo(38, 0);
		ctx.lineTo(85, 0);
		ctx.stroke();

		const body = ctx.createLinearGradient(0, -52, 0, 52);
		body.addColorStop(0, '#e6f2ff');
		body.addColorStop(.5, '#94b8ec');
		body.addColorStop(1, '#3c5c8c');
		ctx.fillStyle = body;
		ctx.strokeStyle = '#64e0ff';
		ctx.lineWidth = 5;
		roundRectPath(ctx, -44, -44, 88, 88, 24);
		ctx.fill();
		ctx.stroke();

		ctx.fillStyle = '#7dff9d';
		[-22, 0, 22].forEach((offset) => {
			ctx.beginPath();
			ctx.arc(offset, -12, 8, 0, Math.PI * 2);
			ctx.fill();
		});
		ctx.fillStyle = '#ffd166';
		[-22, 0, 22].forEach((offset) => {
			ctx.beginPath();
			ctx.arc(offset, 18, 6, 0, Math.PI * 2);
			ctx.fill();
		});

		ctx.strokeStyle = '#dceaff';
		ctx.lineWidth = 5;
		ctx.beginPath();
		ctx.moveTo(0, -44);
		ctx.lineTo(0, -74);
		ctx.stroke();
		ctx.fillStyle = '#ff6b81';
		ctx.beginPath();
		ctx.arc(0, -80, 7 + Math.sin(clock * 5) * 2, 0, Math.PI * 2);
		ctx.fill();

		ctx.strokeStyle = '#7dff9d';
		ctx.lineWidth = 7;
		ctx.beginPath();
		ctx.arc(0, 78, 36, 0, Math.PI * 2);
		ctx.stroke();
		ctx.fillStyle = 'rgba(125, 255, 157, .20)';
		ctx.beginPath();
		ctx.arc(0, 78, 28, 0, Math.PI * 2);
		ctx.fill();

		ctx.restore();
	}

	function draw() {
		const boosting = clock < boostUntil;
		const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
		gradient.addColorStop(0, boosting ? '#100000' : '#050914');
		// Redshift effect while boosting.
		gradient.addColorStop(1, boosting ? '#000000' : '#101a33');

		ctx.fillStyle = gradient;
		ctx.fillRect(0, 0, canvasWidth, canvasHeight);

		ctx.fillStyle = '#cfe6ff';
		starfield.forEach((star) => {
			ctx.globalAlpha = boosting ? .95 : .65;
			ctx.beginPath();
			ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
			ctx.fill();
		});
		ctx.globalAlpha = 1;

		// The space base appears only during a level-up celebration.
		if (levelUpFlight && (gameState === 'enteringBase' || gameState === 'docked')) {
			drawSpaceBase();
		}

		asteroids.forEach((item) => {
			ctx.save();
			ctx.translate(item.x, item.y);
			ctx.rotate(item.spin);
			ctx.fillStyle = '#4b4438';
			ctx.strokeStyle = '#8a7a5e';
			ctx.lineWidth = 3;
			ctx.beginPath();
			item.shape.forEach((scale, index) => {
				const angle = (index / item.shape.length) * Math.PI * 2;
				const x = Math.cos(angle) * ASTEROID_RADIUS * scale;
				const y = Math.sin(angle) * ASTEROID_RADIUS * scale;
				if (index === 0) ctx.moveTo(x, y);
				else ctx.lineTo(x, y);
			});
			ctx.closePath();
			ctx.fill();
			ctx.stroke();
			ctx.restore();
		});

		fallingLetters.forEach((item) => {
			ctx.fillStyle = '#182c52';
			ctx.strokeStyle = '#64e0ff';
			ctx.lineWidth = 3;
			ctx.beginPath();
			ctx.arc(item.x, item.y, LETTER_RADIUS, 0, Math.PI * 2);
			ctx.fill();
			ctx.stroke();

			ctx.fillStyle = '#eaf2ff';
			ctx.font = '900 34px system-ui';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(item.letter.toUpperCase(), item.x, item.y + 2);
		});

		lasers.forEach((laser) => {
			ctx.strokeStyle = '#7dff9d';
			ctx.lineWidth = 5;
			ctx.beginPath();
			ctx.moveTo(laser.x, laser.y);
			ctx.lineTo(laser.x, laser.y + 26);
			ctx.stroke();
		});

		// Cyber-style spaceship.
		ctx.save();
		ctx.translate(shipX, shipY);

		// Light yellow protector circle (graphical only).
		ctx.fillStyle = 'rgba(255, 240, 150, .18)';
		ctx.strokeStyle = 'rgba(255, 235, 120, .55)';
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.arc(0, 0, 42, 0, Math.PI * 2);
		ctx.fill();
		ctx.stroke();

		// Engine glow
		const engineGlow = ctx.createRadialGradient(0, SHIP_HEIGHT / 2 + 10, 2, 0, SHIP_HEIGHT / 2 + 10, 40);
		engineGlow.addColorStop(0, boosting ? 'rgba(255, 80, 80, .85)' : 'rgba(0, 229, 255, .55)');
		engineGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
		ctx.fillStyle = engineGlow;
		ctx.beginPath();
		ctx.arc(0, SHIP_HEIGHT / 2 + 10, 40, 0, Math.PI * 2);
		ctx.fill();

		// Engine flame
		ctx.fillStyle = boosting ? '#ff5a5a' : '#00e5ff';
		ctx.beginPath();
		ctx.moveTo(-9, SHIP_HEIGHT / 2);
		ctx.lineTo(9, SHIP_HEIGHT / 2);
		ctx.lineTo(0, SHIP_HEIGHT / 2 + 30 + Math.random() * 16);
		ctx.closePath();
		ctx.fill();

		// Wings
		ctx.fillStyle = '#12233f';
		ctx.strokeStyle = '#ff2fd0';
		ctx.lineWidth = 3;
		ctx.beginPath();
		ctx.moveTo(-14, 6);
		ctx.lineTo(-34, 22);
		ctx.lineTo(-12, 22);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();
		ctx.beginPath();
		ctx.moveTo(14, 6);
		ctx.lineTo(34, 22);
		ctx.lineTo(12, 22);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		// Main hull
		const hull = ctx.createLinearGradient(0, -SHIP_HEIGHT / 2, 0, SHIP_HEIGHT / 2);
		hull.addColorStop(0, '#e6f7ff');
		hull.addColorStop(.55, '#39c6e8');
		hull.addColorStop(1, '#0d2b4d');
		ctx.fillStyle = hull;
		ctx.strokeStyle = '#00e5ff';
		ctx.lineWidth = 3;
		ctx.beginPath();
		ctx.moveTo(0, -SHIP_HEIGHT / 2);
		ctx.lineTo(SHIP_WIDTH / 2, SHIP_HEIGHT / 2);
		ctx.lineTo(-SHIP_WIDTH / 2, SHIP_HEIGHT / 2);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();

		// Neon centre stripe
		ctx.strokeStyle = '#ff2fd0';
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(0, -SHIP_HEIGHT / 2 + 8);
		ctx.lineTo(0, SHIP_HEIGHT / 2 - 6);
		ctx.stroke();

		// Glowing cockpit
		const cockpit = ctx.createRadialGradient(0, -6, 1, 0, -6, 10);
		cockpit.addColorStop(0, '#ffffff');
		cockpit.addColorStop(.5, '#7df9ff');
		cockpit.addColorStop(1, 'rgba(0, 229, 255, 0)');
		ctx.fillStyle = cockpit;
		ctx.beginPath();
		ctx.arc(0, -6, 10, 0, Math.PI * 2);
		ctx.fill();

		ctx.restore();
	}

	function frame(time) {
		if (lastTime === null) lastTime = time;
		const dt = Math.min((time - lastTime) / 1000, .05);
		lastTime = time;
		clock += dt;

		update(dt);
		draw();
		requestAnimationFrame(frame);
	}

	function moveShip(clientX) {
		// Ignore user control after the word is won.
		if (gameState !== 'playing') return;
		targetShipX = clientX;
	}

	canvas.addEventListener('pointermove', (event) => {
		// Ignore pointermove right after a letter/ship tap so the lane target is kept.
		if (pointerBoostActive) return;
		moveShip(event.clientX);
	});

	canvas.addEventListener('pointerdown', (event) => {
		const x = event.clientX;
		const y = event.clientY;

		// Tap the spaceship to boost.
		if (Math.hypot(x - shipX, y - shipY) < 70) {
			activateBoost();
			pointerBoostActive = true;
			return;
		}

		// Tap a falling letter: move the ship to that letter's lane and boost.
		for (let i = 0; i < fallingLetters.length; i++) {
			const item = fallingLetters[i];
			if (Math.hypot(x - item.x, y - item.y) < LETTER_RADIUS + 12) {
				targetShipX = item.x;
				activateBoost();
				pointerBoostActive = true;
				return;
			}
		}

		moveShip(x);
	});

	canvas.addEventListener('pointerup', () => {
		pointerBoostActive = false;
	});

	canvas.addEventListener('pointercancel', () => {
		pointerBoostActive = false;
	});

	$('game_mode_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./game_mode.html', level_, stars_);
	});

	$('level_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./story.html', level_, stars_);
	});

	$('gift_badge').addEventListener('click', () => {
		sounds.hear();
		goTo('./gift.html', level_, stars_);
	});

	// Close the popup on any tap, pointer, or touch interaction.
	['click', 'pointerdown', 'touchend'].forEach((type) => {
		$('wordPop').addEventListener(type, (event) => {
			event.preventDefault();
			closeWordPopupNow();
		});
	});

	$('popClose').addEventListener('click', (event) => {
		event.preventDefault();
		event.stopPropagation();
		closeWordPopupNow();
	});

	$('wordPop').addEventListener('keydown', (event) => {
		if (event.key === 'Enter' || event.key === ' ') {
			closeWordPopupNow();
		}
	});

	document.addEventListener('keydown', (event) => {
		if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
			keys.left = true;
			event.preventDefault();
		}
		if (event.code === 'ArrowRight' || event.code === 'KeyD') {
			keys.right = true;
			event.preventDefault();
		}
		if (event.code === 'Space' || event.code === 'ArrowUp') {
			event.preventDefault();
		}
	});

	document.addEventListener('keyup', (event) => {
		if (event.code === 'ArrowLeft' || event.code === 'KeyA') keys.left = false;
		if (event.code === 'ArrowRight' || event.code === 'KeyD') keys.right = false;
	});

	window.addEventListener('resize', resize);
	window.addEventListener('orientationchange', () => setTimeout(resize, 120));
	resize();

	$('level').textContent = level_;
	$('stars').textContent = stars_;
	shipX = canvasWidth / 6;
	targetShipX = shipX;
	shipY = canvasHeight - 90;

	try {
		startWord();
	} catch (error) {
		showStartupError(error);
	}

	requestAnimationFrame(frame);

	window.RoboSpaceship = {
		fireLaser,
		spawnAsteroid,
		activateBoost,
		getState: () => ({
			hp,
			clock,
			boostUntil,
			shipX,
			shipY,
			lasers: lasers.length,
			asteroids: asteroids.length,
			letterIndex,
			state: gameState,
			word: current ? current.word : ''
		})
	};
})();
</script>
</body>
</html>
