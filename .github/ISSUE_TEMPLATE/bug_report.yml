name: Bug report
description: Report a reproducible game problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: iPad Safari / Chrome desktop
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
