name: Validate and deploy game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required files
        run: |
          test -f index.html
          test -f game_mode.html
          test -f assets/common.js
          test -f assets/game-lifecycle.js
      - name: Extract and check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          Path("game.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check game.js
      - name: Check core features
        run: |
          grep -q "Robo-Monster Spelling Academy" index.html
          grep -rq "speechSynthesis" assets/
          grep -q "Spelling Mission" game_mode.html
          grep -q "Fish for Letters" game_mode.html
          grep -q "Ghost Letter Zap" game_mode.html
          grep -q "Race and Chase" game_mode.html
          grep -q "Whack-a-mole" game_mode.html
          grep -q "Blank Letters" game_mode.html
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
