<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Spelling · Fishing</title>
<link rel="stylesheet" href="assets/game.css">
<link rel="stylesheet" href="assets/game02_fishing.css">
</head>
<body>
<div id="gamePage">
  <header class="topbar">
    <a class="back" href="game_mode.html" aria-label="Back">←</a>
    <div class="titles">
      <h1>Word Fishing</h1>
      <p class="sub">Tap the fish that matches the word</p>
    </div>
    <div class="hud">
      <span class="pill" id="level">Level 1</span>
      <span class="pill" id="stars">★ 0</span>
    </div>
  </header>
  <main class="pond">
    <div id="playArea" class="play-area"></div>
    <div id="wordPop" class="word-pop" role="dialog" aria-modal="true">
      <div class="pop-card">
        <p class="word" id="popWord">word</p>
        <p class="say" id="popSay">Tap to hear</p>
        <button class="close" id="popClose" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="levelUp" class="level-up" role="dialog" aria-modal="true">
      <div class="card">
        <h2 id="luTitle">Level Up!</h2>
        <p id="luText"></p>
        <button id="luNext">Continue</button>
      </div>
    </div>
  </main>
</div>
<script src="assets/common.js"></script>
<script src="assets/game-lifecycle.js"></script>
<script>
(function(){
  const { $, $$, readProgress, updateProgress, goTo, speak, sounds, tone, modeLabels, modeStories } = RoboCommon;
  const { createTimerManager, createGameLifecycle } = RoboGame;
  const timers = createTimerManager();

  const params = new URLSearchParams(location.search);
  let { level, stars } = readProgress();
  let activeMode = params.get('mode') || 'fish';
  let target = "", popupTimer = null;

  const playArea = $('#playArea');
  const pop = $('#wordPop'), popWord = $('#popWord'), popSay = $('#popSay'), popClose = $('#popClose');
  const levelUp = $('#levelUp'), luTitle = $('#luTitle'), luText = $('#luText'), luNext = $('#luNext');

  function sync(){
    $('#level').textContent = 'Level ' + level;
    $('#stars').textContent = '★ ' + stars;
    const url = new URL(location.href);
    url.searchParams.set('level', level);
    url.searchParams.set('stars', stars);
    url.searchParams.set('mode', activeMode);
    history.replaceState(null,'',url);
  }

  function buildPond(){
    playArea.innerHTML = '';
    const list = RoboCommon.wordsForLevel(level, activeMode);
    target = list[Math.floor(Math.random()*list.length)];
    const others = list.filter(w=>w!==target).slice(0,3);
    const fishWords = [target, ...others].sort(()=>Math.random()-0.5);
    fishWords.forEach(w=>{
      const f = document.createElement('button');
      f.className = 'target fish';
      f.dataset.word = w;
      f.innerHTML = '<span class="fish-body"></span><span class="fish-label">'+w+'</span>';
      f.onclick = ()=>{
        if(w === target){
          stars += 1;
          updateProgress(level, stars);
          sync();
          tone(660,0.09,'sine',0.05);
          buildPond();
        } else {
          tone(220,0.12,'square',0.04);
          f.classList.add('wrong');
        }
      };
      playArea.appendChild(f);
    });
    timers.setTimeout(showWordPopup, 420, target);
  }

  function showWordPopup(w){
    popWord.textContent = w;
    popSay.textContent = 'Tap to hear';
    pop.classList.add('show');
    sounds.hear(w);
    popupTimer = timers.setTimeout(()=>pop.classList.remove('show'), 5000);
  }

  popClose.onclick = ()=>{ clearTimeout(popupTimer); pop.classList.remove('show'); };

  function showLevelUp(){
    const pool = ['spell','fish','ghost','race'].filter(m=>m!==activeMode);
    const nextMode = pool[Math.floor(Math.random()*pool.length)];
    luTitle.textContent = 'Level Up!';
    luText.textContent = (modeStories[nextMode] || ['Great job!'])[0];
    levelUp.classList.add('show');
  }

  luNext.onclick = ()=>{
    levelUp.classList.remove('show');
    goTo('./game_mode.html', level, stars);
  };

  const lifecycle = createGameLifecycle({
    name: 'fishing',
    timers,
    hooks: {
      initGame(){ sync(); buildPond(); },
      pause(){ document.body.classList.add('is-paused'); },
      resume(){ document.body.classList.remove('is-paused'); },
      cleanup(){ pop.classList.remove('show'); }
    }
  });

  lifecycle.initGame();
})();
</script>
</body>
</html>
