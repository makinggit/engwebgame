<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Spelling Academy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="manifest" href="./site.webmanifest">
<link rel="stylesheet" href="./assets/styles.css">
<style>
.install-card {
  margin-top: 18px;
  padding: 16px;
  border: 3px dashed #7652de;
  border-radius: 20px;
  background: #fff8cf;
  text-align: left;
}
.install-card h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}
.install-card p {
  margin: 0 0 12px;
  font-weight: 700;
  line-height: 1.45;
}
.install-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>
<body>
<main class="wrap">
    <section class="panel intro" id="startPage">
        <h1>🤖 Robo-Monster Spelling Academy 👾</h1>
        <div class="hero-row">
            <div class="big-emoji">👾</div>
            <div class="big-emoji">📚</div>
            <div class="big-emoji">🤖</div>
        </div>
        <div class="controls">
            <button class="control" id="startGameBtn" type="button">🎮 Start Game</button>
        </div>
        <div class="install-card" id="installCard" hidden>
            <h2>📱 Add Robo Spelling to Home Screen</h2>
            <p>In Safari, tap <strong>Share</strong>, then choose <strong>Add to Home Screen</strong>. The game will open like an app.</p>
            <div class="install-actions">
                <button class="control" id="dismissInstallBtn" type="button">✖ Don’t show again</button>
            </div>
        </div>
        <div style="display:none">
            <div class="badge" id="game_mode_badge"></div>
            <div class="badge" id="level_badge"></div>
            <div class="badge" id="gift_badge"></div>
        </div>
    </section>

    <section class="panel intro" id="introPage">
        <h1>🤖 Robo-Monster Spelling Academy 👾</h1>
        <div class="hero-row">
            <div class="big-emoji">👾</div>
            <div class="big-emoji">📚</div>
            <div class="big-emoji">🤖</div>
        </div>
        <article class="story-card">
            <strong id="storyTitle"></strong><br /><br />
            <span id="storyBody"></span><br /><br />
            <button class="control yellow" id="hearStoryBtn" type="button">🔊 Hear the Story</button>
        </article>
        <div class="controls">
            <button class="control" id="game_mode" type="button">🎮 Choose Game Mode</button>
        </div>
    </section>
</main>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script>
(function () {
    'use strict';
    const { $, readProgress, goTo, sounds, say } = RoboCommon;
    const { level, stars } = readProgress();
    const story = RoboStory.getStoryPage(1);

    $('storyTitle').textContent = story.title;
    $('storyBody').textContent = story.text;

    $('startGameBtn').addEventListener('click', () => {
        sounds.hear();
        $('startPage').style.display = 'none';
        $('introPage').style.display = 'block';
        say(story.title + '. ' + story.text);
    });

    $('hearStoryBtn').addEventListener('click', () => {
        sounds.hear();
        say(story.title + '. ' + story.text);
    });

    $('game_mode').addEventListener('click', () => {
        sounds.hear();
        goTo('./game_mode.html', level, stars);
    });

    // Show Add to Home Screen guidance on iOS Safari only.
    const installCard = $('installCard');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    const dismissed = localStorage.getItem('roboInstallGuidanceDismissed') === '1';

    if (isIOS && !isStandalone && !dismissed) {
        installCard.hidden = false;
    }

    $('dismissInstallBtn').addEventListener('click', () => {
        sounds.click();
        localStorage.setItem('roboInstallGuidanceDismissed', '1');
        installCard.hidden = true;
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js').catch((error) => {
                console.warn('Service worker registration failed:', error);
            });
        });
    }

    $('startPage').style.display = 'block';
})();
</script>
</body>
</html>
