<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Spelling · Whack-a-Word</title>
<link rel="stylesheet" href="assets/game.css">
<link rel="stylesheet" href="assets/game05_whack_a_mole.css">
</head>
<body>
<div id="gamePage">
  <header class="topbar">
    <a class="back" href="game_mode.html" aria-label="Back">←</a>
    <div class="titles">
      <h1>Whack-a-Word</h1>
      <p class="sub">Tap the mole with the right word</p>
    </div>
    <div class="hud">
      <span class="pill" id="level">Level 1</span>
      <span class="pill" id="stars">★ 0</span>
      <span class="pill" id="carrots">🥕 0</span>
    </div>
  </header>
  <main class="garden">
    <div id="moleBoard" class="mole-board"></div>
    <div id="wordPop" class="word-pop" role="dialog" aria-modal="true">
      <div class="pop-card">
        <p class="word" id="popWord">word</p>
        <p class="say" id="popSay">Tap to hear</p>
        <button class="close" id="popClose" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="levelUp" class="level-up" role="dialog" aria-modal="true">
      <div class="card">
        <h2 id="luTitle">Level Up!</h2>
        <p id="luText"></p>
        <button id="luNext">Continue</button>
      </div>
    </div>
  </main>
</div>
<script src="assets/common.js"></script>
<script src="assets/game-lifecycle.js"></script>
<script>
(function(){
  const { $, $$, readProgress, updateProgress, goTo, sounds, tone } = RoboCommon;
  const { createTimerManager, createGameLifecycle } = RoboGame;
  const timers = createTimerManager();

  const params = new URLSearchParams(location.search);
  let { level, stars } = readProgress();
  let activeMode = params.get('mode') || 'mole';
  let carrots = parseInt(params.get('carrots') || '0', 10) || 0;
  let target = "", popupTimer = null;
  let molePopTimers = [];
  let wordPhase = 'playing';

  const board = $('#moleBoard');
  const pop = $('#wordPop'), popWord = $('#popWord'), popSay = $('#popSay'), popClose = $('#popClose');
  const levelUp = $('#levelUp'), luTitle = $('#luTitle'), luText = $('#luText'), luNext = $('#luNext');

  function sync(){
    $('#level').textContent = 'Level ' + level;
    $('#stars').textContent = '★ ' + stars;
    $('#carrots').textContent = '🥕 ' + carrots;
    const url = new URL(location.href);
    url.searchParams.set('level', level);
    url.searchParams.set('stars', stars);
    url.searchParams.set('mode', activeMode);
    url.searchParams.set('carrots', carrots);
    history.replaceState(null,'',url);
  }

  function buildMoleBoard(){
    board.innerHTML = '';
    for(let i=0;i<9;i++){
      const hole = document.createElement('div');
      hole.className = 'mole-hole';
      hole.dataset.index = i;
      board.appendChild(hole);
    }
  }

  function popMoles(){
    if(wordPhase !== 'playing') return;
    const list = RoboCommon.wordsForLevel(level, activeMode);
    target = list[Math.floor(Math.random()*list.length)];
    const others = list.filter(w=>w!==target).slice(0,2);
    const moleWords = [target, ...others].sort(()=>Math.random()-0.5);
    const holes = $$('.mole-hole');
    molePopTimers.forEach(clearTimeout);
    molePopTimers = [];
    moleWords.forEach((w,i)=>{
      const t = timers.setTimeout(()=>{
        const hole = holes[i];
        if(!hole) return;
        hole.innerHTML = '<button class="mole" data-word="'+w+'">'+w+'</button>';
        const btn = hole.querySelector('.mole');
        btn.onclick = ()=>{
          if(w === target){
            stars += 1;
            updateProgress(level, stars);
            sync();
            tone(660,0.09,'sine',0.05);
            popMoles();
          } else {
            tone(220,0.12,'square',0.04);
            btn.classList.add('wrong');
          }
        };
        const hide = timers.setTimeout(()=>{ hole.innerHTML = ''; }, 1800);
        molePopTimers.push(hide);
      }, i*400);
      molePopTimers.push(t);
    });
    timers.setTimeout(showWordPopup, 420, target);
  }

  function stopMoles(){
    molePopTimers.forEach(clearTimeout);
    molePopTimers = [];
    $$('.mole-hole').forEach(h=>h.innerHTML = '');
  }

  function showWordPopup(w){
    popWord.textContent = w;
    popSay.textContent = 'Tap to hear';
    pop.classList.add('show');
    sounds.hear(w);
    popupTimer = timers.setTimeout(()=>pop.classList.remove('show'), 5000);
  }

  popClose.onclick = ()=>{ clearTimeout(popupTimer); pop.classList.remove('show'); };

  luNext.onclick = ()=>{
    levelUp.classList.remove('show');
    goTo('./game_mode.html', level, stars, { carrots });
  };

  const lifecycle = createGameLifecycle({
    name: 'whack-a-word',
    timers,
    hooks: {
      initGame(){
        sync();
        buildMoleBoard();
        wordPhase = 'playing';
        popMoles();
      },
      pause(){
        stopMoles();
        document.body.classList.add('is-paused');
      },
      resume(){
        document.body.classList.remove('is-paused');
        if(wordPhase === 'playing') popMoles();
      },
      cleanup(){
        stopMoles();
        pop.classList.remove('show');
      }
    }
  });

  document.addEventListener('pointerdown', function once(){
    sounds.click();
    document.removeEventListener('pointerdown', once);
  }, { once:true });

  lifecycle.initGame();
})();
</script>
</body>
</html>
