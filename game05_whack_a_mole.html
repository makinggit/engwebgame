<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Spelling Academy</title>
<style>
:root {
    --ink: #202452;
    --purple: #7652de;
    --pink: #fa64ac;
    --yellow: #ffd34f;
    --mint: #53d8bb;
    --sky: #65cffa;
    --good: #31b96b;
    --bad: #ef4d5e;
}
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
html {
    min-height: 100%;
    touch-action: manipulation;
}
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: #d8f7ff;
    transition: background 0.7s ease;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body:before,
body:after {
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    opacity: 0.55;
    pointer-events: none;
}
body:before {
    width: 220px;
    height: 220px;
    left: -70px;
    top: 12%;
    background: #ffcf6c;
}
body:after {
    width: 250px;
    height: 250px;
    right: -90px;
    bottom: 7%;
    background: #b894ff;
}
.wrap {
    width: min(970px, calc(100% - 28px));
    margin: auto;
    padding: 22px 0 36px;
}
h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 3rem);
    text-shadow: 3px 3px rgba(255, 255, 255, 0.8);
}
.panel {
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.86);
    border: 4px solid var(--ink);
    border-radius: 30px;
    padding: clamp(18px, 4vw, 36px);
    box-shadow: 10px 10px 0 rgba(32, 36, 82, 0.28);
    backdrop-filter: blur(4px);
}
.intro {
    text-align: center;
}
.story-card {
    max-width: 710px;
    margin: 22px auto;
    padding: 20px;
    border: 3px dashed var(--purple);
    border-radius: 22px;
    background: #fff8cf;
    font-size: clamp(1rem, 2.7vw, 1.22rem);
    line-height: 1.55;
    text-align: left;
}
.hero-row,
.controls {
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}
.big-emoji {
    font-size: 5rem;
}
.control {
    border: 3px solid var(--ink);
    border-radius: 14px;
    min-height: 48px;
    padding: 12px 16px;
    background: var(--mint);
    color: var(--ink);
    font:
        800 1rem "Trebuchet MS",
        Arial,
        sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 4px 4px 0 var(--ink);
    transition: 0.1s;
}
.control:hover,
.control:focus {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink);
    outline: none;
}
.control:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--ink);
}
.control.yellow {
    background: var(--yellow);
}
.control.purple {
    background: #d5c4ff;
}
.game {
    display: none;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}
.badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.badge {
    background: var(--yellow);
    padding: 9px 13px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-weight: 900;
    box-shadow: 3px 3px 0 var(--ink);
}
.top {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: center;
    margin-top: 18px;
}
.speech {
    background: #fff3a7;
    padding: 16px 20px;
    border: 3px solid var(--ink);
    border-radius: 20px;
    font-size: clamp(1rem, 2.7vw, 1.24rem);
    font-weight: 800;
    line-height: 1.35;
}
.friend {
    position: relative;
    width: 150px;
    height: 128px;
    border: 4px solid var(--ink);
    animation: bob 1.8s ease-in-out infinite;
}
.monster {
    background: var(--pink);
    border-radius: 48% 48% 42% 42%;
}
.eye {
    position: absolute;
    top: 30px;
    width: 36px;
    height: 42px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: #fff;
}
.eye.left {
    left: 27px;
}
.eye.right {
    right: 27px;
}
.pupil {
    display: block;
    width: 13px;
    height: 18px;
    background: var(--ink);
    border-radius: 50%;
    margin: 13px auto;
}
.mouth {
    position: absolute;
    left: 43px;
    bottom: 21px;
    width: 58px;
    height: 27px;
    border: 3px solid var(--ink);
    border-top: 0;
    border-radius: 0 0 28px 28px;
    background: #fff;
}
.antenna {
    position: absolute;
    width: 5px;
    height: 28px;
    background: var(--ink);
    top: -26px;
    left: 72px;
}
.robot {
    display: none;
    border-radius: 20px;
    background: var(--sky);
}
.screen {
    position: absolute;
    left: 20px;
    top: 28px;
    width: 105px;
    height: 58px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: #14213c;
    color: var(--mint);
    display: grid;
    place-items: center;
    font-size: 1.45rem;
}
.word-box {
    margin: 28px auto 14px;
    text-align: center;
}
.emoji {
    font-size: 4.4rem;
    min-height: 82px;
}
.hint {
    font-size: 1.14rem;
    font-weight: 900;
}
.slots {
    min-height: 68px;
    margin: 14px auto;
    display: flex;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
}
.slot {
    width: 48px;
    height: 58px;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    display: grid;

    place-items: center;
    background: #f4f0ff;

    font-size: 2rem;
    font-weight: 900;
}
.slot.good {
    background: #d8f8e4;
    border-style: solid;
    border-color: var(--good);
    color: #157840;
}
.slot.bad {
    background: #ffdce0;
    border-style: solid;
    border-color: var(--bad);
    color: #b5273b;
}
.letters {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 18px 0 24px;
}
.letter {
    min-width: 58px;
    min-height: 58px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    color: var(--ink);
    background: #fff;
    font:
        900 1.65rem/1 "Trebuchet MS",
        Arial,
        sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 4px 4px 0 var(--ink);
}
.letter:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--ink);
}
.letter:disabled {
    opacity: 0.35;
    box-shadow: 2px 2px 0 #99a;
    cursor: default;
}
.message {
    min-height: 30px;
    margin-top: 18px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 900;
}
.progress {
    position: relative;
    margin: 20px auto 0;
    max-width: 560px;
    height: 32px;
    overflow: hidden;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: #e7e8f6;
}
.bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--mint), var(--yellow), var(--pink));
    transition: width 0.35s;
}
.progress-content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.95rem;
    font-weight: 900;
    text-shadow: 1px 1px #fff;
}
.star-track {
    letter-spacing: 2px;
    font-size: 1.08rem;
}
.word-pop,
.levelup,
.mode-select {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    z-index: 30;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
.word-pop {
    background: rgba(32, 36, 82, 0.34);
    cursor: pointer;
}
.word-pop.show {
    display: grid;
}
.word-card,
.level-card,
.mode-card {
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 30px;
    box-shadow: 12px 12px 0 var(--purple);
    padding: 25px;
    text-align: center;
    animation: pop 0.35s ease;
}
.word-card .small {
    font-weight: 900;
    font-size: 1.1rem;
}
.bigword {
    font-size: clamp(2.5rem, 12vw, 5.3rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--purple);
    margin-top: 8px;
}
.close-note {
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: 800;
    color: #525780;
}
.levelup,
.mode-select {
    background: rgba(32, 36, 82, 0.61);
    overflow: auto;
}
.level-card {
    width: min(660px, 100%);
    background: #fff8c9;
}
.level-card h2 {
    margin: 0;
    font-size: 2.3rem;
}
.level-story {
    background: #fff;
    border: 3px dashed var(--pink);
    border-radius: 18px;
    padding: 15px;
    margin: 15px 0;
    text-align: left;
    line-height: 1.5;
    font-weight: 700;
    max-height: 280px;
    overflow: auto;
}
.sparkles {
    font-size: 3rem;
    letter-spacing: 5px;
    animation: spin 1.5s linear infinite;
}
.mode-card {
    width: min(820px, 100%);
    background: #ecfbff;
}
.mode-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 18px 0;
}
.mode-btn {
    border: 4px solid var(--ink);
    border-radius: 20px;
    min-height: 155px;
    padding: 16px 10px;
    background: #fff;
    cursor: pointer;
    touch-action: manipulation;
    color: var(--ink);
    font:
        800 1rem "Trebuchet MS",
        Arial;
    box-shadow: 4px 4px 0 var(--ink);
}
.mode-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--ink);
}
.mode-icon {
    display: block;
    font-size: 3.2rem;
    margin-bottom: 8px;
}
.bonus-screen {
    display: none;
}
.bonus-screen.active {
    display: block;
}
.bonus-header {
    text-align: center;
    margin: 18px 0;
}
.bonus-title {
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    font-weight: 900;
}
.bonus-story {
    max-width: 760px;
    margin: 12px auto;
    padding: 15px;
    border: 3px dashed var(--purple);
    border-radius: 18px;
    background: #fff8cf;
    line-height: 1.45;
    font-weight: 800;
}
.play-area {
    position: relative;
    width: 100%;
    height: 320px;
    border: 4px solid var(--ink);
    border-radius: 22px;
    overflow: hidden;
    background: #7cd9ff;
    margin: 16px 0;
    touch-action: manipulation;
}
.water:before {
    content: "🌊 🌊 🌊 🌊 🌊 🌊";
    position: absolute;
    z-index: 1;
    bottom: -4px;
    left: 0;
    width: 100%;
    font-size: 3rem;
    white-space: nowrap;
}
.dock {
    position: absolute;
    z-index: 1;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 42px;
    background: #a66a3e;
    border-top: 7px solid #6d4027;
}
.target {
    position: absolute;
    z-index: 2;
    border: 3px solid var(--ink);
    border-radius: 50%;
    min-width: 52px;
    min-height: 48px;
    background: #fff;
    padding: 7px 11px;
    font-size: 1.35rem;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 3px 3px 0 var(--ink);
    user-select: none;
}
.target:active {
    transform: scale(0.92);
}
.fish {
    background: #ffd869;
    animation: swim 7s ease-in-out infinite alternate;
}
.fish:nth-of-type(2n) {
    animation-duration: 9s;
    animation-direction: alternate-reverse;
}
.fish:nth-of-type(3n) {
    animation-duration: 11s;
}
.race-area {
    background: linear-gradient(#aee9ff 0 48%, #7bd45d 48%);
}
.runner {
    position: absolute;
    z-index: 1;
    bottom: 32px;
    font-size: 3.5rem;
    transition: left 0.45s ease;
}
.track {
    position: absolute;
    bottom: 20px;
    width: 100%;
    border-top: 5px dashed #fff;
}
.mini-word {
    text-align: center;
    font-size: 2rem;
    font-weight: 900;
    color: var(--purple);
    margin: 8px;
    word-break: break-word;
    letter-spacing: 4px;
}
.mini-word .matched-letter {
    color: #31b96b;
}
.bonus-status {
    text-align: center;
    min-height: 32px;
    font-size: 1.15rem;
    font-weight: 900;
}
@keyframes swim {
    0% {
        transform: translateX(0) translateY(0) rotate(-3deg);
    }
    50% {
        transform: translateX(28px) translateY(-12px) rotate(3deg);
    }
    100% {
        transform: translateX(-20px) translateY(8px) rotate(-2deg);
    }
}
@keyframes float {
    to {
        transform: translateY(-18px) rotate(5deg);
    }
}
.celebrate {
    animation: celebrate 0.55s ease-in-out 2;
}
@keyframes bob {
    50% {
        transform: translateY(-8px) rotate(2deg);
    }
}
@keyframes celebrate {
    50% {
        transform: scale(1.18) rotate(-8deg);
    }
}
@keyframes pop {
    from {
        transform: scale(0.4) rotate(-8deg);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 650px) {
    .wrap {
        width: min(100% - 18px, 970px);
        padding-top: 12px;
    }
    .panel {
        border-radius: 22px;
        padding: 18px;
    }
    .top {
        grid-template-columns: 1fr;
    }
    .friend {
        margin: auto;
    }
    .mode-grid {
        grid-template-columns: 1fr;
    }
    .mode-btn {
        min-height: 104px;
    }
    .slot {
        width: 42px;
        height: 53px;
    }
    .badge {
        font-size: 0.9rem;
    }
    .play-area {
        height: 290px;
    }
    .target {
        min-width: 58px;
        min-height: 54px;
        font-size: 1.25rem;
    }
}

@media (orientation: landscape) and (max-height: 650px) {
    .wrap {
        padding-top: 8px;
    }
    .panel {
        margin-top: 8px;
        padding: 16px;
    }
    .word-box {
        margin: 12px auto;
    }
    .emoji {
        font-size: 3.1rem;
        min-height: 50px;
    }
    .play-area {
        height: 210px;
    }
    .level-story {
        max-height: 150px;
    }
}

/* Whack-a-letter: preserve the surrounding academy layout. */
#playArea.mole-board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: clamp(6px, 2vw, 14px);
    padding: clamp(8px, 2vw, 16px);
    background: linear-gradient(#b8e897, #72bb66);
    height: clamp(270px, 48vh, 430px);
}
.mole-hole {
    position: relative;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    border-radius: 22px;
    background: radial-gradient(ellipse at 50% 78%, #3c251c 0 34%, #8d613c 36% 45%, transparent 47%);
}
.mole-button {
    position: absolute;
    inset: 3px 8% 12%;
    width: 84%;
    border: 0;
    border-radius: 35% 35% 18% 18%;
    background: #bb8052;
    color: #fff;
    font: 900 clamp(24px, 5vw, 38px) "Trebuchet MS", sans-serif;
    text-shadow: 1px 2px #503322;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    touch-action: manipulation;
    transform: translateY(130%);
    visibility: hidden;
    transition: transform 180ms ease, visibility 180ms;
    -webkit-user-select: none;
    user-select: none;
}
.mole-button.is-up {
    transform: translateY(0);
    visibility: visible;
}
.mole-button:active { filter: brightness(1.15); }
.mole-button:focus-visible { outline: 4px solid #ffe466; outline-offset: -4px; }
.mole-face { font-size: clamp(22px, 4vw, 36px); }
@media (prefers-reduced-motion: reduce) {
    .mole-button { transition: none; }
}


/* Whole words fit inside each of the nine holes. */
#playArea .mole-button {
    flex-direction: column;
    gap: 0;
    padding: 2px;
    min-width: 0;
    font-size: clamp(14px, 3.2vw, 25px);
}
.mole-word {
    display: block;
    max-width: 100%;
    white-space: nowrap;
    font-size: inherit;
    letter-spacing: -0.3px;
}
#playArea .mole-face { font-size: clamp(20px, 4vw, 32px); }
.mole-button.is-hit { animation: word-mole-hit 320ms ease-in forwards; }
@keyframes word-mole-hit {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(10%) scale(1.06, .7); }
    100% { transform: translateY(130%) scale(.9); }
}
#miniHearBtn[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
    .mole-button.is-hit { animation-duration: 1ms; }
}

</style>
</head>
<body>
<main class="wrap">
    <section class="panel game" id="gamePage">
        <header>
            <h1 id="gameHeading">Spelling Mission</h1>
            <div class="badges">
                <div class="badge" id="game_mode">🎮 Mode</div>
                <div class="badge">🏆 Level <span id="level">1</span></div>
                <div class="badge">⭐ Stars <span id="stars">0</span></div>
            </div>
        </header>
        <div id="spellingView">
            <div class="top">
                <div class="speech" id="speech">Listen first, then build the word!</div>
                <div class="friend monster" id="monster">
                    <i class="antenna"></i><i class="eye left"><b class="pupil"></b></i
                    ><i class="eye right"><b class="pupil"></b></i><i class="mouth"></i>
                </div>
                <div class="friend robot" id="robot"><div class="screen">^_^</div></div>
            </div>
            <div class="word-box">
                <div class="emoji" id="emoji">📓</div>
                <div class="hint" id="hint"></div>
                <div class="slots" id="slots"></div>
            </div>
            <div class="letters" id="letters"></div>
            <div class="controls">
                <button class="control purple" id="undoBtn" type="button">↩ Undo</button
                ><button class="control yellow" id="hearBtn" type="button">🔊 Hear the Word</button
                ><button class="control yellow" id="newBtn" type="button">🎲 New Word</button>
            </div>
            <div class="message" id="message"></div>
            <div class="progress">
                <div class="bar" id="bar"></div>
                <div class="progress-content">
                    <span class="star-track" id="starTrack">☆☆☆</span
                    ><span id="progressNumber">0 / 3 stars to Level 2</span>
                </div>
            </div>
        </div>
        <section class="bonus-screen" id="bonusView">
            <div class="bonus-header">
                <div class="bonus-title" id="bonusTitle"></div>
                <div class="bonus-story" id="bonusStory"></div>
            </div>
            <div class="play-area" id="playArea"></div>
            <div class="controls">
                <button class="control purple" id="miniHearBtn" type="button">🔊 Hear the Word</button>
            </div>
        </section>
    </section>
</main>
<div class="word-pop" id="wordPop" role="button" tabindex="0" aria-label="Close word card">
    <div class="word-card">
        <div class="small">Listen to the word:</div>
        <div class="bigword" id="popWord">notebook</div>
        <div class="close-note">Tap anywhere to close • closes automatically in 8 seconds</div>
    </div>
</div>
<div class="levelup" id="levelModal">
    <div class="level-card">
        <div class="sparkles">✨ 🏆 ✨</div>
        <h2>Level Up!</h2>
        <p id="levelMessage"></p>
        <article class="level-story" id="levelStory"></article>
        <p id="nextModeMessage"></p>
        <div class="controls">
            <button class="control yellow" id="hearLevelStoryBtn" type="button">🔊 Hear This Story</button
            ><button class="control" id="game_mode_next" type="button">Start Next Adventure!</button>
        </div>
    </div>
</div>

<script>const words = [
    { word: "notebook", emoji: "📓", clue: "You write notes and drawings in it." },
    { word: "yellow", emoji: "💛", clue: "It is the colour of a banana." },
    { word: "purple", emoji: "💜", clue: "It is a colour made by mixing red and blue." },

function tone(f = 440, d = 0.08, t = "sine", v = 0.05) {
    try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const o = audioCtx.createOscillator(),
            g = audioCtx.createGain();
        o.type = t;
        o.frequency.value = f;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + d);
    } catch (e) {}
}

        $("bonusStory").textContent = "Remember the word, then tap the mole showing that whole word!";
        $("miniHearBtn").hidden = true;
        buildMoleBoard();
        wordPopupActive = true;
        wordPopupDeadline = performance.now() + 5000;
        $("popWord").textContent = bonusWord;
        $("wordPop").classList.add("show");
        $("wordPop").setAttribute("role", "dialog");
        $("wordPop").setAttribute("aria-label", "Remember the target word");
        $("wordPop").querySelector(".close-note").textContent = "Remember this word • the game starts in 5 seconds";
        say("Find the word " + bonusWord + ".");
        popupTimer = setTimeout(closeWordPopup, 5000);
        return;
    }
    bonusWord = nextWord().word;
    bonusRemaining = bonusWord.split("");
    $("miniHearBtn").hidden = false;
    $("bonusTitle").textContent = { fish: "🐟 Fish for Letters", ghost: "👻 Ghost Letter Zap", race: "🏃 Rainbow Race and Chase" }[mode];
    $("bonusStory").textContent = modeStories[mode];
    renderMiniWord(-1);
    say($("bonusTitle").textContent + ". The word is " + bonusWord + ".");
    buildBonus();
}
function buildBonus() {
    stopMoles();
    if (activeMode === "mole") {
        buildMoleBoard();
        return;
    }
    const area = $("playArea");
    area.innerHTML = "";
    area.className = "play-area " + (activeMode === "race" ? "race-area" : activeMode === "mole" ? "water" : "");
    if (activeMode === "race") {
        const runner = document.createElement("div");
        runner.className = "runner";
        runner.id = "runner";
        runner.style.left = "4%";
        runner.textContent = "👾";
        area.appendChild(runner);
    }
    if (activeMode === "mole") {
        const dock = document.createElement("div");
        dock.className = "dock";
        area.appendChild(dock);
    }
    spawnTargets();
    ensureTargetFish();
						 
															
}
function ensureTargetFish() {
    if (activeMode === "mole") {
        if (!moleTimer && bonusRemaining.length) popMoles();
        return;
    }
    if (activeMode !== "mole" || !bonusRemaining.length) return;
    const wanted = bonusRemaining[0];
    const exists = [...document.querySelectorAll("#playArea .target.fish")].some((el) => el.dataset.letter === wanted);
    if (exists) return;
    const area = $("playArea"),
        fish = [...area.querySelectorAll(".target.fish")],
        positions = [
            [5, 12],
            [27, 55],
            [51, 15],
            [72, 54],
        ],
        used = new Set(fish.map((el) => el.style.left + "/" + el.style.top));
    const spot = positions.find(([x, y]) => !used.has(x + "%/" + y + "%")) || positions[0],
        x = document.createElement("button");
    x.className = "target fish";
    x.type = "button";
    x.dataset.letter = wanted;
    x.textContent = "🐟 " + wanted;
    x.style.left = spot[0] + "%";
    x.style.top = spot[1] + "%";
    x.onclick = () => bonusClick(wanted, x);
    area.appendChild(x);
}
function updateLetter() {
    ensureTargetFish();
}

function clearGhostTimers() {
    clearInterval(ghostTimer);
    clearTimeout(ghostHintTimer);
    clearTimeout(ghostHintHideTimer);
    ghostTimer = ghostHintTimer = ghostHintHideTimer = null;
}
function spawnTargets() {
    const area = $("playArea"),
        required = [...new Set(bonusRemaining)],
        distractors = shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter((x) => !required.includes(x))).slice(
            0,
            Math.max(4, required.length + 1)
        ),
        choices = shuffle([...required, ...distractors]),
        positions = [
            [5, 12],
            [27, 55],
            [51, 15],
            [72, 54],
        ];
    choices.slice(0, positions.length).forEach((letter, i) => {
        const x = document.createElement("button");
        x.className = "target " + (activeMode === "mole" ? "mole" : activeMode === "ghost" ? "ghost" : "");
        x.dataset.letter = letter;
        x.type = "button";
        x.textContent = activeMode === "mole" ? "🐟 " + letter : activeMode === "ghost" ? "👻 " + letter : letter;
        x.style.left = positions[i][0] + "%";
        x.style.top = positions[i][1] + "%";
        x.onclick = () => bonusClick(letter, x);
        area.appendChild(x);
    });
}
function bonusClick(letter, el) {
    if (activeMode === "mole") {
        hitWordMole(letter, el);
        return;
    }
    if (activeMode === "mole" && (!bonusRemaining.length || moleFinishing || !el.isConnected || !el.classList.contains("is-up"))) return;
    if (activeMode === "mole") {
        el.disabled = true;
        el.classList.remove("is-up");
    }
    const wanted = bonusRemaining[0];
    if (letter === wanted) {
        sounds.win();
        bonusRemaining.shift();
        el.remove();
		renderMiniWord(bonusWord.length - bonusRemaining.length - 1)
        if (activeMode === "race") {
            const runner = $("runner");
            runner.style.left =
                Math.min(76, parseInt(runner.style.left, 10) + Math.max(8, 70 / bonusWord.length)) + "%";
        }
        if (!bonusRemaining.length) {
            if (activeMode === "mole") {
                moleFinishing = true;
                stopMoles();
                document.querySelectorAll(".mole-button").forEach(button => {
                    button.disabled = true;
                    button.classList.remove("is-up");
                });
            }
            (document.getElementById("bonusStatus") || removedBonusStatus).textContent = "Amazing! You finished the word.";
            setTimeout(() => awardWin(bonusWord), 900);
        } else {
            (document.getElementById("bonusStatus") || removedBonusStatus).textContent = "Correct!";
            say("Correct! The word is " + spellWord(bonusWord));
            //updateLetter();
            buildBonus();
        }
    } else {
        sounds.wrong();
        (document.getElementById("bonusStatus") || removedBonusStatus).textContent = "Good try. Find the letter " + wanted + ".";
        say("Good try. Find the letter " + wanted + ".");
    }
}
$("undoBtn").onclick = () => {
    if (!answer.length) return;
    sounds.undo();
    const last = answer.pop(),
        item = letterOrder.find((x) => x.letter === last && selected[x.index]);
    if (item) selected[item.index] = false;
    checking = false;
    message.textContent = "";
    setPrompt("One letter removed. Choose another letter.");
    render();
};
$("hearBtn").onclick = showWordPopup;
$("newBtn").onclick = () => {
    sounds.click();
    chooseWord();
};
$("wordPop").onclick = closeWordPopup;
$("wordPop").onkeydown = (e) => {
    if (e.key === "Enter" || e.key === " ") closeWordPopup();
};
$("hearLevelStoryBtn").onclick = () => {
    sounds.hear();
    say($("levelStory").textContent);
};
$("miniHearBtn").onclick = () => {
    if (activeMode === "mole") return;
    sounds.hear();
    say("The word is " + spellWord(bonusWord));
};
$("game_mode").onclick = () => {
    sounds.hear();
    window.location.assign('./game_mode.html?level=' + level + '&stars=' + stars);
};
$("game_mode_next").onclick = () => {
    sounds.hear();
    window.location.assign('./game_mode.html?level=' + level + '&stars=' + stars);
};


const removedBonusStatus = document.createElement("div");
let wordPopupActive = false;
let wordPopupDeadline = 0;
let moleAwardTimer = null;
let moleRound = 0;
let moleTimer = null;
let moleFinishing = false;
let moleButtons = [];

function stopMoles() {
    clearTimeout(moleTimer);
    moleTimer = null;
}

function buildMoleBoard() {
    const area = $("playArea");
    area.replaceChildren();
    area.className = "play-area mole-board";
    area.setAttribute("role", "group");
    area.setAttribute("aria-label", "Nine-hole letter mole board");
    moleFinishing = false;
    moleButtons = [];

    for (let i = 0; i < 9; i += 1) {
        const hole = document.createElement("div");
        hole.className = "mole-hole";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "mole-button";
        button.disabled = true;
        button.onclick = () => bonusClick(button.dataset.word, button);
        hole.appendChild(button);
        area.appendChild(hole);
        moleButtons.push(button);
    }
    // Wait for the five-second popup before the first wave.
}


function lowerMoles() {
    moleButtons.forEach(button => {
        button.disabled = true;
        button.classList.remove("is-up", "is-hit");
    });
}

function hitWordMole(word, button) {
    if (wordPopupActive || moleFinishing || !bonusRemaining.length || !button || !button.isConnected || button.disabled || !button.classList.contains("is-up")) return;
    button.disabled = true;
    button.classList.add("is-hit");
    if (word.toLowerCase() !== bonusWord.toLowerCase()) {
        sounds.wrong();
        // Do not repeat the target: the child remembers the opening popup.
        return;
    }
    moleFinishing = true;
    bonusRemaining = [];
    stopMoles();
    sounds.win();
    moleButtons.forEach(other => {
        other.disabled = true;
        if (other !== button) other.classList.remove("is-up");
    });
    const round = moleRound;
    const wonWord = bonusWord;
    moleAwardTimer = setTimeout(() => {
        if (round !== moleRound || activeMode !== "mole") return;
        lowerMoles();
        awardWin(wonWord);
    }, 500);
}

function popMoles() {
    stopMoles();
    if (activeMode !== "mole" || wordPopupActive || moleFinishing || !bonusRemaining.length || document.hidden) return;
    if (!$("playArea").classList.contains("mole-board")) return;
    lowerMoles();
    const uniqueWords = [...new Set(words.map(item => item.word))];
    const distractors = shuffle(uniqueWords.filter(word => word.toLowerCase() !== bonusWord.toLowerCase())).slice(0, 2);
    const choices = [bonusWord, ...distractors];
    const holes = shuffle([...moleButtons]);
    choices.forEach((word, i) => {
        const button = holes[i];
        button.dataset.word = word;
        button.setAttribute("aria-label", "Mole word " + word);
        const face = document.createElement("span");
        face.className = "mole-face";
        face.textContent = "🐹";
        face.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "mole-word";
        label.textContent = word;
        button.replaceChildren(face, label);
        button.disabled = false;
        button.classList.add("is-up");
    });
    moleTimer = setTimeout(() => {
        lowerMoles();
        moleTimer = setTimeout(popMoles, 350);
    }, 2800);
}

document.addEventListener("visibilitychange", () => {
    stopMoles();
    if (!document.hidden && activeMode === "mole") {
        if (wordPopupActive) {
            clearTimeout(popupTimer);
            popupTimer = setTimeout(closeWordPopup, Math.max(0, wordPopupDeadline - performance.now()));
        } else if (!moleFinishing && bonusRemaining.length) popMoles();
    }
});
window.addEventListener("pagehide", stopMoles);


$("gamePage").style.display = "block";
activateMode("mole");
updateProgress();
</script>
