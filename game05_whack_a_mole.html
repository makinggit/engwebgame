<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Spelling Academy</title>
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<main class="wrap">
	<section class="panel game" id="gamePage">
		<header>
			<h1 id="gameHeading">Spelling Mission</h1>
			<div class="badges">
				<div class="badge" id="game_mode">🎮 Mode</div>
				<div class="badge">🏆 Level <span id="level">1</span></div>
				<div class="badge" id="carrotBadge" aria-live="polite">🥕 <span id="carrots">0</span>/7</div>
				<div class="badge">⭐ Stars <span id="stars">0</span></div>
			</div>
		</header>
		<div id="spellingView">
			<div class="top">
				<div class="speech" id="speech">Listen first, then build the word!</div>
				<div class="friend monster" id="monster">
					<i class="antenna"></i><i class="eye left"><b class="pupil"></b></i
					><i class="eye right"><b class="pupil"></b></i><i class="mouth"></i>
				</div>
				<div class="friend robot" id="robot"><div class="screen">^_^</div></div>
			</div>
			<div class="word-box">
				<div class="emoji" id="emoji">📓</div>
				<div class="hint" id="hint"></div>
				<div class="slots" id="slots"></div>
			</div>
			<div class="letters" id="letters"></div>
			<div class="controls">
				<button class="control purple" id="undoBtn" type="button">↩ Undo</button
				><button class="control yellow" id="hearBtn" type="button">🔊 Hear the Word</button
				><button class="control yellow" id="newBtn" type="button">🎲 New Word</button>
			</div>
			<div class="message" id="message"></div>
			<div class="progress">
				<div class="bar" id="bar"></div>
				<div class="progress-content">
					<span class="star-track" id="starTrack">☆☆☆</span
					><span id="progressNumber">0 / 3 stars to Level 2</span>
				</div>
			</div>
		</div>
		<section class="bonus-screen" id="bonusView">
			<div class="bonus-header">
				<div class="bonus-title" id="bonusTitle"></div>
				<div class="bonus-story" id="bonusStory"></div>
			</div>
			<div class="mini-word" id="miniWord"></div>
			<div class="bonus-status" id="bonusStatus"></div>
			<div class="play-area" id="playArea"></div>
			<div class="controls">
				<button class="control purple" id="miniHearBtn" type="button">🔊 Hear the Word</button>
			</div>
		</section>
	</section>
</main>
<div class="word-pop" id="wordPop" role="button" tabindex="0" aria-label="Close word card">
	<div class="word-card">
		<div class="small">Listen to the word:</div>
		<div class="bigword" id="popWord">notebook</div>
		<div class="close-note">Tap anywhere to close • closes automatically in 5 seconds</div>
	</div>
</div>
<div class="levelup" id="levelModal">
	<div class="level-card">
		<div class="sparkles">✨ 🏆 ✨</div>
		<h2>Level Up!</h2>
		<p id="levelMessage"></p>
		<article class="level-story" id="levelStory"></article>
		<p id="nextModeMessage"></p>
		<div class="controls">
			<button class="control yellow" id="hearLevelStoryBtn" type="button">🔊 Hear This Story</button
			><button class="control" id="game_mode_next" type="button">Start Next Adventure!</button>
		</div>
	</div>
</div>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script src="./assets/game-lifecycle.js"></script>
<script>
const { $, readProgress, getParams, goTo, sounds, say, shuffle, randomBg, updateProgress, tone } = RoboCommon;
const { level, stars } = readProgress();
const timers = RoboGame.createTimerManager();
const words = RoboWords.WORD_LIST;
const params = getParams();
const modeStories = {
	spell: "The Word Workshop Story. Momo and Bolt opened a workshop full of mixed-up letters. Put each letter in the correct order to repair the school words and make the workshop lights shine.",
	fish: "The Poor Dock Fish Story. At the old poor dock, hungry little letter fish could not find their way to the warm water garden. Every correct letter you catch repairs the dock and helps the fish swim home.",
	ghost: "The Friendly Ghost Story. In the school library, tiny letter ghosts floated out of an old black notebook. Bolt built a gentle zapper to send the correct letter ghosts safely back to their word homes.",
	race: "The Rainbow Race Story. A speedy word sprite raced through the school playground, carrying mixed-up letters. Catch each correct letter to chase the sprite along the rainbow track and recover the colours.",
	mole: "The Letter Garden. Friendly letter moles are popping out of nine holes! Tap the next letter to spell the word. Missed letters will return, so take your time.",
};
const modeLabels = { spell: "Spelling", fish: "Fishs", ghost: "Ghosts", race: "Race", mole: "Moles" };
const speech = $("speech"),
	emoji = $("emoji"),
	hint = $("hint"),
	slots = $("slots"),
	letters = $("letters"),
	message = $("message"),
	starsEl = $("stars"),
	levelEl = $("level"),
	bar = $("bar"),
	progressNumber = $("progressNumber"),
	starTrack = $("starTrack"),
	monster = $("monster"),
	robot = $("robot");
let current,
	answer = [],
	selected = [],
	robotMode = false,
	letterOrder = [],
	checking = false,
	popupTimer,
	wordDeck = [],
	activeMode = "spell",
	bonusWord = "",
	bonusRemaining = [],
	nextMode = "spell";

const CARROTS_PER_STAR = 7;
const savedCarrots = Number(params.get("carrots") || 0);
let carrots = Number.isFinite(savedCarrots) && savedCarrots >= 0
	? Math.floor(savedCarrots) % CARROTS_PER_STAR : 0;
starsEl.textContent = stars;
levelEl.textContent = level;

const popSound = () => tone(740, 0.055, "triangle", 0.035);

function spellWord(word) {
	return word + ". " + word.split("").join(",") + " . " + word + ". ";
}
function setPrompt(t, read = true) {
	speech.textContent = t;
	if (read) say(t);
}
function closeWordPopup() {
	clearTimeout(popupTimer);
	$("wordPop").classList.remove("show");
}
function showWordPopup() {
	if (!current) return;
	clearTimeout(popupTimer);
	$("popWord").textContent = current.word;
	$("wordPop").classList.add("show");
	sounds.hear();
	say("The word is " + current.word);
	popupTimer = timers.setTimeout(closeWordPopup, 8000);
}
function nextWord() {
	if (!wordDeck.length) wordDeck = shuffle(words);
	return wordDeck.pop();
}
function activateMode(mode) {
	stopMoles();
	closeWordPopup();
	activeMode = mode;
	$("spellingView").style.display = mode === "spell" ? "block" : "none";
	$("bonusView").classList.toggle("active", mode !== "spell");
	randomBg();
	if (mode === "spell") {
		chooseWord();
	} else {
		startBonusMode(mode);
	}
}
function chooseWord() {
	if (activeMode !== "spell") return;
	checking = false;
	randomBg();
	robotMode = !robotMode;
	monster.style.display = robotMode ? "none" : "block";
	robot.style.display = robotMode ? "block" : "none";
	current = nextWord();
	answer = [];
	selected = Array(current.word.length).fill(false);
	letterOrder = shuffle(current.word.split("").map((letter, index) => ({ letter, index })));
	emoji.textContent = current.emoji;
	hint.textContent = current.clue;
	message.textContent = "";
	setPrompt(robotMode ? "BEEP! Robo Bolt has a word for you!" : "Momo has a new spelling mission!");
	render();
	timers.setTimeout(showWordPopup, 420);
}
function render(result = null) {
	slots.innerHTML = "";
	for (let i = 0; i < current.word.length; i++) {
		const d = document.createElement("div");
		d.className = "slot";
		d.textContent = answer[i] || "";
		if (result && answer[i]) d.classList.add(result[i] ? "good" : "bad");
		slots.appendChild(d);
	}
	letters.innerHTML = "";
	letterOrder.forEach(({ letter, index }) => {
		const b = document.createElement("button");
		b.className = "letter";
		b.type = "button";
		b.textContent = letter;
		b.disabled = selected[index] || checking;
		b.onclick = () => pick(letter, index);
		letters.appendChild(b);
	});
}
function pick(letter, index) {
	if (checking || answer.length >= current.word.length) return;
	sounds.click();
	answer.push(letter);
	selected[index] = true;
	render();
	if (answer.length === current.word.length) check();
}
function check() {
	checking = true;
	const r = current.word.split("").map((c, i) => answer[i] === c);
	render(r);
	if (r.every(Boolean)) {
		sounds.win();
		awardWin(current.word);
	} else {
		sounds.wrong();
		const t = "Good try. Green letters are correct. Red letters need fixing. Press Undo and try again.";
		message.textContent = t;
		setPrompt(t);
		checking = false;
		render(r);
	}
}
function awardWin(word) {
	stars++;
	starsEl.textContent = stars;
	updateCarrots();
	updateProgress(level, stars);
	message.textContent = "🎉 ZAP! Correct! You spelled " + word + ".";
	setPrompt("Hooray! You are a super speller!");
	if (activeMode !== "mole") timers.setTimeout(() => say("The word is " + word), 350);
	if (stars % 3 === 0) {
		level++;
		levelEl.textContent = level;
		updateCarrots();
		timers.setTimeout(showLevelUp, 950);
	} else {
		timers.setTimeout(() => {
			if (activeMode === "spell") chooseWord();
			else startBonusMode(activeMode);
		}, 1650);
	}
}
function showLevelUp() {
	sounds.level();
	const story = RoboStory.getStoryPage(level).text;
	nextMode = ["spell", "fish", "ghost", "race", "mole"][Math.floor(Math.random() * 4)];
	$("levelMessage").textContent = "You collected 3 stars and reached Level " + level + "!";
	$("levelStory").textContent = story;
	$("nextModeMessage").textContent = "Next adventure: " + modeLabels[nextMode] + " mode!";
	$("levelModal").style.display = "grid";
	say("Level up! You reached level " + level + ". " + story + " Next adventure: " + modeLabels[nextMode] + " mode.");
}
function renderMiniWord(matchedIndex = -1) {
	const target = $("miniWord");
	target.innerHTML = "";
	[...bonusWord].forEach((letter, i) => {
		const span = document.createElement("span");
		span.textContent = letter;
		span.className = i <= matchedIndex ? "matched-letter" : "";
		target.appendChild(span);
	});
}
function startBonusMode(mode) {
	if (mode !== "mole") {
		bonusWord = nextWord().word;
		bonusRemaining = bonusWord.split("");
		buildBonus();
		return;
	}
	stopMoles();
	clearTimeout(wordIntroTimer);
	clearTimeout(wordAwardTimer);
	clearInterval(wordHintTimer);
	wordHintTimer = null;
	wordRound += 1;
	bonusWord = nextWord().word;
	bonusRemaining = [bonusWord];
	wordPhase = "intro";
	$("bonusTitle").textContent = "🔨 Whack-a-Word";
	$("bonusStory").textContent = "Remember the word, then tap the matching mole!";
	buildMoleBoard();
	$("popWord").textContent = bonusWord;
	$("wordPop").classList.add("show");
	const note = $("wordPop").querySelector(".close-note");
	if (note) note.textContent = "Remember this word • starts automatically in 5 seconds";
	say("The word is " + bonusWord);
	const round = wordRound;
	wordIntroTimer = timers.setTimeout(() => {
		if (round !== wordRound || activeMode !== "mole") return;
		$("wordPop").classList.remove("show");
		$("popWord").textContent = "";
		wordPhase = "playing";
		moleFinishing = false;
		popMoles();
		wordHintTimer = timers.setInterval(() => {
			if (round === wordRound && activeMode === "mole" &&
				wordPhase === "playing" && !document.hidden) {
				say("Remember, find the word " + bonusWord + ".");
			}
		}, 12000);
	}, 5000);
}
function buildBonus() {
	stopMoles();
	if (activeMode === "mole") {
		buildMoleBoard();
		return;
	}
	const area = $("playArea");
	area.innerHTML = "";
	area.className = "play-area " + (activeMode === "race" ? "race-area" : activeMode === "mole" ? "water" : "");
	if (activeMode === "race") {
		const runner = document.createElement("div");
		runner.className = "runner";
		runner.id = "runner";
		runner.style.left = "4%";
		runner.textContent = "👾";
		area.appendChild(runner);
	}
	if (activeMode === "mole") {
		const dock = document.createElement("div");
		dock.className = "dock";
		area.appendChild(dock);
	}
	spawnTargets();
	ensureTargetFish();
}
function ensureTargetFish() {
	if (activeMode === "mole") {
		if (!moleTimer && bonusRemaining.length) popMoles();
		return;
	}
	if (activeMode !== "mole" || !bonusRemaining.length) return;
	const wanted = bonusRemaining[0];
	const exists = [...document.querySelectorAll("#playArea .target.fish")].some((el) => el.dataset.letter === wanted);
	if (exists) return;
	const area = $("playArea"),
		fish = [...area.querySelectorAll(".target.fish")],
		positions = [
			[5, 12],
			[27, 55],
			[51, 15],
			[72, 54],
		],
		used = new Set(fish.map((el) => el.style.left + "/" + el.style.top));
	const spot = positions.find(([x, y]) => !used.has(x + "%/" + y + "%")) || positions[0],
		x = document.createElement("button");
	x.className = "target fish";
	x.type = "button";
	x.dataset.letter = wanted;
	x.textContent = "🐟 " + wanted;
	x.style.left = spot[0] + "%";
	x.style.top = spot[1] + "%";
	x.onclick = () => bonusClick(wanted, x);
	area.appendChild(x);
}
function updateLetter() {
	ensureTargetFish();
}

function clearGhostTimers() {
	clearInterval(ghostTimer);
	clearTimeout(ghostHintTimer);
	clearTimeout(ghostHintHideTimer);
	ghostTimer = ghostHintTimer = ghostHintHideTimer = null;
}
function spawnTargets() {
	const area = $("playArea"),
		required = [...new Set(bonusRemaining)],
		distractors = shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter((x) => !required.includes(x))).slice(
			0,
			Math.max(4, required.length + 1)
		),
		choices = shuffle([...required, ...distractors]),
		positions = [
			[5, 12],
			[27, 55],
			[51, 15],
			[72, 54],
		];
	choices.slice(0, positions.length).forEach((letter, i) => {
		const x = document.createElement("button");
		x.className = "target " + (activeMode === "mole" ? "mole" : activeMode === "ghost" ? "ghost" : "");
		x.dataset.letter = letter;
		x.type = "button";
		x.textContent = activeMode === "mole" ? "🐟 " + letter : activeMode === "ghost" ? "👻 " + letter : letter;
		x.style.left = positions[i][0] + "%";
		x.style.top = positions[i][1] + "%";
		x.onclick = () => bonusClick(letter, x);
		area.appendChild(x);
	});
}
function bonusClick(letter, el) {
	if (activeMode === "mole") {
		hitWordMole(letter, el);
		return;
	}
	const wanted = bonusRemaining[0];
	if (letter === wanted) {
		sounds.win();
		bonusRemaining.shift();
		el.remove();
		renderMiniWord(bonusWord.length - bonusRemaining.length - 1);
		if (!bonusRemaining.length) {
			$("bonusStatus").textContent = "Amazing! You finished the word.";
			timers.setTimeout(() => awardWin(bonusWord), 900);
		} else {
			$("bonusStatus").textContent = "Correct!";
			say("Correct! The word is " + bonusWord);
			buildBonus();
		}
	} else {
		sounds.wrong();
		$("bonusStatus").textContent = "Good try. Find the letter " + wanted + ".";
		say("Good try. Find the letter " + wanted + ".");
	}
}

function hitWordMole(word, button) {
	if (wordPhase !== "playing" || moleFinishing || !button || button.disabled ||
		!button.isConnected || !button.classList.contains("is-up")) return;
	moleFinishing = true;
	stopMoles();
	button.classList.add("is-hit");
	moleButtons.forEach(mole => {
		mole.disabled = true;
		mole.classList.remove("is-up");
	});
	const round = wordRound;
	if (word.toLowerCase() !== bonusWord.toLowerCase()) {
		sounds.wrong();
		moleTimer = timers.setTimeout(() => {
			if (round !== wordRound || activeMode !== "mole" || wordPhase !== "playing") return;
			moleFinishing = false;
			popMoles();
		}, 450);
		return;
	}
	wordPhase = "finishing";
	bonusRemaining = [];
	clearInterval(wordHintTimer);
	wordHintTimer = null;
	sounds.win();
	const earnedStar = collectCarrot();
	const completedWord = bonusWord;
	wordAwardTimer = timers.setTimeout(() => {
		if (round !== wordRound || activeMode !== "mole") return;
		if (earnedStar) awardWin(completedWord);
		else startBonusMode("mole");
	}, 650);
}
$("undoBtn").onclick = () => {
	if (!answer.length) return;
	sounds.undo();
	const last = answer.pop(),
		item = letterOrder.find((x) => x.letter === last && selected[x.index]);
	if (item) selected[item.index] = false;
	checking = false;
	message.textContent = "";
	setPrompt("One letter removed. Choose another letter.");
	render();
};
$("hearBtn").onclick = showWordPopup;
$("newBtn").onclick = () => {
	sounds.click();
	chooseWord();
};
$("wordPop").onclick = closeWordPopup;
$("wordPop").onkeydown = (e) => {
	if (e.key === "Enter" || e.key === " ") closeWordPopup();
};
$("hearLevelStoryBtn").onclick = () => {
	sounds.hear();
	say($("levelStory").textContent);
};
$("miniHearBtn").onclick = () => {
	sounds.hear();
	say(activeMode === "mole" ? "The word is " + bonusWord + "." : "The word is " + bonusWord);
};
$("game_mode").onclick = () => {
	sounds.hear();
	goTo('./game_mode.html', level, stars, { carrots });
};
$("game_mode_next").onclick = () => {
	sounds.hear();
	goTo('./game_mode.html', level, stars, { carrots });
};


let molePopTimers = [];
let moleTimer = null;
let moleFinishing = false;
let moleButtons = [];

function stopMoles() {
	clearTimeout(moleTimer);
	moleTimer = null;
	molePopTimers.forEach(clearTimeout);
	molePopTimers = [];
}

function buildMoleBoard() {
	const area = $("playArea");
	area.replaceChildren();
	area.className = "play-area mole-board";
	area.setAttribute("role", "group");
	area.setAttribute("aria-label", "Nine-hole letter mole board");
	moleFinishing = false;
	moleButtons = [];

	for (let i = 0; i < 9; i += 1) {
		const hole = document.createElement("div");
		hole.className = "mole-hole";
		const button = document.createElement("button");
		button.type = "button";
		button.className = "mole-button";
		button.disabled = true;
		button.onclick = () => bonusClick(button.dataset.word, button);
		hole.appendChild(button);
		area.appendChild(hole);
		moleButtons.push(button);
	}
	popMoles();
}

function popMoles() {
	stopMoles();
	if (activeMode !== "mole" || wordPhase !== "playing" || moleFinishing || document.hidden) return;
	if (!$("playArea").classList.contains("mole-board")) return;

	moleButtons.forEach(button => {
		button.disabled = true;
		button.classList.remove("is-up", "is-hit");
	});

	const uniqueWords = [...new Set(words.map(item => item.word))];
	const distractors = uniqueWords.filter(word => word.toLowerCase() !== bonusWord.toLowerCase());
	const choices = [bonusWord, ...shuffle(distractors).slice(0, 2)];
	const holes = shuffle([...moleButtons]);

	choices.forEach((word, i) => {
		const button = holes[i];
		button.dataset.word = word;
		button.setAttribute("aria-label", "Mole word " + word);
		const face = document.createElement("span");
		face.className = "mole-face";
		face.textContent = "🐹";
		face.setAttribute("aria-hidden", "true");
		const label = document.createElement("span");
		label.className = "mole-word";
		label.textContent = word;
		button.replaceChildren(face, label);
		molePopTimers.push(timers.setTimeout(() => {
			if (document.hidden || wordPhase !== "playing" || moleFinishing || activeMode !== "mole") return;
			button.disabled = false;
			button.classList.add("is-up");
			popSound();
		}, i * 100));
	});

	moleTimer = timers.setTimeout(() => {
		moleButtons.forEach(button => {
			button.disabled = true;
			button.classList.remove("is-up", "is-hit");
		});
		moleTimer = timers.setTimeout(popMoles, 300);
	}, 2400);
}

document.addEventListener("visibilitychange", () => {
	stopMoles();
	if (!document.hidden && activeMode === "mole" && !moleFinishing && wordPhase === "playing" && bonusRemaining.length) popMoles();
});
window.addEventListener("pagehide", stopMoles);



let wordIntroTimer = null;
let wordAwardTimer = null;
let wordHintTimer = null;
let wordRound = 0;
let wordPhase = "idle";


function updateCarrots() {
	$("carrots").textContent = carrots;
	$("carrotBadge").setAttribute("aria-label", carrots + " of 7 carrots toward a star");
	params.set("carrots", carrots);
	params.set("stars", stars);
	params.set("level", level);
	try { history.replaceState(null, "", "?" + params.toString()); } catch (error) {}
}

function collectCarrot() {
	carrots += 1;
	const earnedStar = carrots >= CARROTS_PER_STAR;
	if (earnedStar) carrots -= CARROTS_PER_STAR;
	updateCarrots();
	return earnedStar;
}

document.addEventListener("pointerdown", () => {
	sounds.click();
}, { once: true });
window.addEventListener("pagehide", () => {
	clearInterval(wordHintTimer);
	clearTimeout(wordIntroTimer);
	clearTimeout(wordAwardTimer);
});
updateCarrots();
$("gamePage").style.display = "block";
activateMode("mole");
updateProgress(level, stars);
</script>
</body>
</html>
