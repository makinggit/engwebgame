<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Spelling Academy</title>
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<main class="wrap">
	<section class="panel game" id="gamePage">
		<header>
			<h1 id="gameHeading">Spelling Mission</h1>
			<div class="badges">
				<div class="badge" id="game_mode">🎮 Mode</div>
				<div class="badge">🏆 Level <span id="level">1</span></div>
				<div class="badge">⭐ Stars <span id="stars">0</span></div>
			</div>
		</header>
		<div id="spellingView">
			<div class="top">
				<div class="speech" id="speech">Listen first, then build the word!</div>
				<div class="friend monster" id="monster">
					<i class="antenna"></i><i class="eye left"><b class="pupil"></b></i
					><i class="eye right"><b class="pupil"></b></i><i class="mouth"></i>
				</div>
				<div class="friend robot" id="robot"><div class="screen">^_^</div></div>
			</div>
			<div class="word-box">
				<div class="emoji" id="emoji">📓</div>
				<div class="hint" id="hint"></div>
				<div class="slots" id="slots"></div>
			</div>
			<div class="letters" id="letters"></div>
			<div class="controls">
				<button class="control purple" id="undoBtn" type="button">↩ Undo</button
				><button class="control yellow" id="hearBtn" type="button">🔊 Hear the Sentence</button
				><!--<button class="control yellow" id="newBtn" type="button">🎲 New Word</button>-->
			</div>
			<div class="message" id="message"></div>
			<div class="progress">
				<div class="bar" id="bar"></div>
				<div class="progress-content">
					<span class="star-track" id="starTrack">☆☆☆</span
					><span id="progressNumber">0 / 3 stars to Level 2</span>
				</div>
			</div>
		</div>

		<section class="bonus-screen" id="bonusView">
			<div class="bonus-header">
				<div class="bonus-title" id="bonusTitle"></div>
				<div class="bonus-story" id="bonusStory"></div>
			</div>
			<div class="mini-word" id="miniWord"></div>
			<div class="bonus-status" id="bonusStatus"></div>
			<div class="play-area" id="playArea"></div>
			<div class="controls">
				<button class="control purple" id="miniHearBtn" type="button">🔊 Hear the Sentence</button>
			</div>
		</section>
	</section>
</main>

<div class="word-pop" id="wordPop" role="button" tabindex="0" aria-label="Close word card">
	<div class="word-card">
		<div class="small">Listen to the word:</div>
		<div class="bigword" id="popWord">notebook</div>
		<div class="close-note">Tap anywhere to close • closes automatically in 8 seconds</div>
	</div>
</div>

<div class="levelup" id="levelModal">
	<div class="level-card">
		<div class="sparkles">✨ 🏆 ✨</div>
		<h2>Level Up!</h2>
		<p id="levelMessage"></p>
		<article class="level-story" id="levelStory"></article>
		<div class="controls">
			<button class="control yellow" id="hearLevelStoryBtn" type="button">🔊 Hear This Story</button
			><button class="control" id="game_mode_next" type="button">Start Next Adventure!</button>
		</div>
	</div>
</div>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script src="./assets/game-lifecycle.js"></script>
<script>
const { $, readProgress, getParams, goTo, sounds, say, shuffle, randomBg, updateProgress } = RoboCommon;
const { level, stars } = readProgress();
const timers = RoboGame.createTimerManager();
const words = RoboWords.WORD_LIST;
const params = getParams();
const modeStories = {
	spell: "The Word Workshop Story. Momo and Bolt opened a workshop full of mixed-up letters. Put each letter in the correct order to repair the school words and make the workshop lights shine.",
	fish: "The Poor Dock Fish Story. At the old poor dock, hungry little letter fish could not find their way to the warm water garden. Every correct letter you catch repairs the dock and helps the fish swim home.",
	ghost: "The Friendly Ghost Story. In the school library, tiny letter ghosts floated out of an old black notebook. Bolt built a gentle zapper to send the correct letter ghosts safely back to their word homes.",
	race: "The Rainbow Race Story. A speedy word sprite raced through the school playground, carrying mixed-up letters. Catch each correct letter to chase the sprite along the rainbow track and recover the colours.",
};
const modeLabels = { spell: "Spelling", fish: "Fish", ghost: "Ghosts", race: "Race" };
const speech = $("speech"),
	emoji = $("emoji"),
	hint = $("hint"),
	slots = $("slots"),
	letters = $("letters"),
	message = $("message"),
	starsEl = $("stars"),
	levelEl = $("level"),
	bar = $("bar"),
	progressNumber = $("progressNumber"),
	starTrack = $("starTrack"),
	monster = $("monster"),
	robot = $("robot");
let current,
	answer = [],
	selected = [],
	robotMode = false,
	letterOrder = [],
	checking = false,
	popupTimer,
	wordDeck = [],
	activeMode = "spell",
	bonusWord = "",
	bonusRemaining = [],
	nextMode = "spell";

starsEl.textContent = stars;
levelEl.textContent = level;

function spellWord(word) {
	return word + ". " + word.split("").join(",") + " . " + word + ". ";
}
function setPrompt(t, read = true) {
	speech.textContent = t;
	if (read) say(t);
}
function closeWordPopup() {
	clearTimeout(popupTimer);
	$("wordPop").classList.remove("show");
}
function showWordPopup() {
	if (!current) return;
	clearTimeout(popupTimer);
	$("popWord").textContent = current.word;
	$("wordPop").classList.add("show");
	sounds.hear();
	say("The word is " + current.word + ". " + current.word);
	popupTimer = timers.setTimeout(closeWordPopup, 8000);
}
function nextWord() {
	if (!wordDeck.length) wordDeck = shuffle(words);
	return wordDeck.pop();
}
function activateMode(mode) {
	closeWordPopup();
	activeMode = mode;
	$("spellingView").style.display = mode === "spell" ? "block" : "none";
	$("bonusView").classList.toggle("active", mode !== "spell");
	randomBg();
	if (mode === "spell") {
		chooseWord();
	} else {
		startBonusMode(mode);
	}
}

function showLevelUp() {
	sounds.level();
	const story = RoboStory.getStoryPage(level).text;
	nextMode = ["spell", "fish", "ghost", "race"][Math.floor(Math.random() * 4)];
	$("levelMessage").textContent = "You collected 3 stars and reached Level " + level + "!";
	$("levelStory").textContent = story;
	$("levelModal").style.display = "grid";
	say("Level up! You reached level " + level + ". " + story + " Next adventure: " + modeLabels[nextMode] + " mode.");
}
function startBonusMode(mode) {
	bonusWord = nextWord().word;
	bonusRemaining = bonusWord.split("");
	$("bonusTitle").textContent = {
		fish: "🐟 Fish for Letters",
		ghost: "👻 Ghost Letter Zap",
		race: "🏃 Rainbow Race and Chase",
	}[mode];
	$("bonusStory").textContent = modeStories[mode];
	renderMiniWord(-1);
	$("bonusStatus").textContent = "Find the first letter: " + bonusRemaining[0];
	say($("bonusTitle").textContent + ". " + modeStories[mode] + " The word is " + bonusWord + ".");
	buildBonus();
}
const mazeLayout = ["111111111", "100000001", "101110101", "100010001", "111010111", "100000001", "111111111"];
let mazePos = { r: 3, c: 4 },
	ghosts = [],
	ghostTimer = null,
	flashTimer = null,
	ghostHintTimer = null,
	ghostHintHideTimer = null;
function buildBonus() {
	const area = $("playArea");
	if (activeMode === "ghost") {
		buildGhostMaze();
		return;
	}
	area.innerHTML = "";
	area.className = "play-area " + (activeMode === "race" ? "race-area" : activeMode === "fish" ? "water" : "");
	if (activeMode === "race") {
		const runner = document.createElement("div");
		runner.className = "runner";
		runner.id = "runner";
		runner.style.left = "4%";
		runner.textContent = "👾";
		area.appendChild(runner);
	}
	if (activeMode === "fish") {
		const dock = document.createElement("div");
		dock.className = "dock";
		area.appendChild(dock);
	}
	spawnTargets();
}
function clearGhostTimers() {
	clearInterval(ghostTimer);
	clearTimeout(ghostHintTimer);
	clearTimeout(ghostHintHideTimer);
	ghostTimer = ghostHintTimer = ghostHintHideTimer = null;
}
function buildGhostMaze() {
	clearGhostTimers();
	const area = $("playArea");
	$("gamePage").classList.add("ghost-maze-mode");
	area.innerHTML = "";
	area.className = "play-area ghost-maze";
	const field = document.createElement("div");
	field.className = "ghost-maze-field";
	area.appendChild(field);
	mazeLayout.forEach((row) =>
		[...row].forEach((cell) => {
			const tile = document.createElement("div");
			tile.className = "maze-cell " + (cell === "1" ? "maze-wall" : "maze-floor");
			field.appendChild(tile);
		})
	);
	const player = document.createElement("div");
	player.className = "maze-player";
	player.id = "mazePlayer";
	player.textContent = "🤖";
	field.appendChild(player);
	if (!ghosts.length) {
		[
			[1, 7],
			[3, 1],
			[5, 7],
		].forEach((pos, i) => {
			const box = document.createElement("button");
			box.type = "button";
			box.className = "ghost-box";
			const wanted = bonusRemaining[0],
				letters = [wanted, ...shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter((x) => x !== wanted))];
			box.dataset.letter = letters[i];
			box.innerHTML = "<span>👻</span><span>" + letters[i] + "</span>";
			box.onclick = () => {};
			field.appendChild(box);
			ghosts.push({ r: pos[0], c: pos[1], el: box, dr: i % 2 ? 0 : 1, dc: i % 2 ? 1 : 0 });
		});
	} else ghosts.forEach((g) => field.appendChild(g.el));
	const controls = document.createElement("div");
	controls.className = "ghost-maze-controls";
	[
		["↑", -1, 0, "up"],
		["←", 0, -1, "left"],
		["↓", 1, 0, "down"],
		["→", 0, 1, "right"],
	].forEach(([t, dr, dc, cl]) => {
		const b = document.createElement("button");
		b.className = cl;
		b.type = "button";
		b.textContent = t;
		b.onclick = () => moveMaze(dr, dc);
		controls.appendChild(b);
	});
	area.appendChild(controls);
	positionMaze();
	ghostTimer = timers.setInterval(moveGhosts, 900);
	ghostHintTimer = timers.setTimeout(showGhostHint, 20000);
}
function positionMaze() {
	const field = document.querySelector(".ghost-maze-field"),
		w = field.clientWidth,
		h = field.clientHeight,
		cw = w / 9,
		ch = h / 7,
		place = (el, r, c) => {
			el.style.left = c * cw + 8 + "px";
			el.style.top = r * ch + 8 + "px";
		};
	place($("mazePlayer"), mazePos.r, mazePos.c);
	ghosts.forEach((g) => place(g.el, g.r, g.c));
}
function validMaze(r, c) {
	return r > 0 && r < 6 && c > 0 && c < 8 && mazeLayout[r][c] === "0";
}
function moveMaze(dr, dc) {
	const nr = mazePos.r + dr,
		nc = mazePos.c + dc;
	if (!validMaze(nr, nc)) return;
	mazePos = { r: nr, c: nc };
	sounds.click();
	positionMaze();
	checkGhostCollisions();
}
function moveGhosts() {
	if (activeMode !== "ghost" || ghosts.length !== 3) return;
	const used = new Set([mazePos.r + "," + mazePos.c]);
	ghosts.forEach((g) => used.add(g.r + "," + g.c));
	ghosts.forEach((g) => {
		const options = shuffle([
			[0, 1],
			[0, -1],
			[1, 0],
			[-1, 0],
		]).filter(([dr, dc]) => validMaze(g.r + dr, g.c + dc) && !used.has(g.r + dr + "," + (g.c + dc)));
		if (options.length) {
			used.delete(g.r + "," + g.c);
			const [dr, dc] = options[0];
			g.r += dr;
			g.c += dc;
			used.add(g.r + "," + g.c);
		}
	});
	positionMaze();
	checkGhostCollisions();
}
function checkGhostCollisions() {
	const robot = $("mazePlayer");
	if (!robot) return;
	const a = robot.getBoundingClientRect();
	ghosts.slice().forEach((g, i) => {
		const b = g.el.getBoundingClientRect();
		if (a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top) resolveGhostCollision(i);
	});
}
function resolveGhostCollision(i) {
	const g = ghosts[i],
		wanted = bonusRemaining[0];
	if (!g || !wanted) return;
	if (g.el.dataset.letter !== wanted) {
		wrongMaze();
		return;
	}
	sounds.win();
	g.el.remove();
	ghosts.splice(i, 1);
	const matchedIndex = bonusWord.length - bonusRemaining.length;
	bonusRemaining.shift();
	renderMiniWord(matchedIndex);
	if (!bonusRemaining.length) {
		clearGhostTimers();
		$("bonusStatus").textContent = "Amazing! You finished the word.";
		timers.setTimeout(() => awardWin(bonusWord), 900);
		return;
	}
	const pos = [
		[1, 7],
		[3, 1],
		[5, 7],
	].find((x) => !ghosts.some((g) => g.r === x[0] && g.c === x[1])) || [1, 7];
	const el = document.createElement("button");
	el.type = "button";
	el.className = "ghost-box";
	el.dataset.letter = bonusRemaining[0];
	el.innerHTML = "<span>👻</span><span>" + bonusRemaining[0] + "</span>";
	el.onclick = () => {};
	const next = { r: pos[0], c: pos[1], el, dr: 1, dc: 1 };
	ghosts.push(next);
	document.querySelector(".ghost-maze-field").appendChild(el);
	positionMaze();
	ghostHintTimer = timers.setTimeout(showGhostHint, 20000);
}
function renderMiniWord(matchedIndex = -1) {
	const target = $("miniWord");
	target.innerHTML = "";
	[...bonusWord].forEach((letter, i) => {
		const span = document.createElement("span");
		span.textContent = letter;
		span.className = i <= matchedIndex ? "matched-letter" : "";
		target.appendChild(span);
	});
}
function showGhostHint() {
	const g = ghosts.find((x) => x.el.dataset.letter === bonusRemaining[0]);
	if (!g) return;
	g.el.classList.add("hint-ghost");
	say("Hint! The correct ghost is getting bigger. Find the letter " + bonusRemaining[0] + ".");
	ghostHintHideTimer = timers.setTimeout(() => g.el.classList.remove("hint-ghost"), 4500);
}
function wrongMaze() {
	sounds.wrong();
	$("bonusStatus").textContent = "Move Bolt onto a ghost to check its letter.";
	document.body.classList.add("invert-flash");
	clearTimeout(flashTimer);
	flashTimer = timers.setTimeout(() => document.body.classList.remove("invert-flash"), 1000);
}
function spawnTargets() {
	const area = $("playArea"),
		required = [...new Set(bonusRemaining)],
		distractors = shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter((x) => !required.includes(x))).slice(
			0,
			Math.max(4, required.length + 1)
		),
		choices = shuffle([...required, ...distractors]),
		positions = [
			[5, 12],
			[27, 55],
			[51, 15],
			[72, 54],
			[10, 70],
			[43, 72],
			[75, 15],
			[57, 48],
			[30, 20],
			[82, 72],
		];
	choices.slice(0, positions.length).forEach((letter, i) => {
		const x = document.createElement("button");
		x.className = "target " + (activeMode === "fish" ? "fish" : activeMode === "ghost" ? "ghost" : "");
		x.type = "button";
		x.textContent = activeMode === "fish" ? "🐟 " + letter : activeMode === "ghost" ? "👻 " + letter : letter;
		x.style.left = positions[i][0] + "%";
		x.style.top = positions[i][1] + "%";
		x.onclick = () => bonusClick(letter, x);
		area.appendChild(x);
	});
}
function bonusClick(letter, el) {
	const wanted = bonusRemaining[0];
	if (letter === wanted) {
		sounds.win();
		bonusRemaining.shift();
		el.remove();
		$("miniWord").textContent = bonusRemaining.join("") || "You won!";
		if (activeMode === "race") {
			const runner = $("runner");
			runner.style.left =
				Math.min(76, parseInt(runner.style.left, 10) + Math.max(8, 70 / bonusWord.length)) + "%";
		}
		if (!bonusRemaining.length) {
			$("bonusStatus").textContent = "Amazing! You finished the word.";
			timers.setTimeout(() => awardWin(bonusWord), 900);
		} else {
			$("bonusStatus").textContent = "Correct! Find the next letter: " + bonusRemaining[0];
			say("Correct! Find the next letter: " + bonusRemaining[0]);
			buildBonus();
		}
	} else {
		sounds.wrong();
		$("bonusStatus").textContent = "Good try. Find the letter " + wanted + ".";
		say("Good try. Find the letter " + wanted + ".");
	}
}
$("undoBtn").onclick = () => {
	if (!answer.length) return;
	sounds.undo();
	const last = answer.pop(),
		item = letterOrder.find((x) => x.letter === last && selected[x.index]);
	if (item) selected[item.index] = false;
	checking = false;
	message.textContent = "";
	setPrompt("One letter removed. Choose another letter.");
	render();
};
$("hearBtn").onclick = showWordPopup;
$("wordPop").onclick = closeWordPopup;
$("wordPop").onkeydown = (e) => {
	if (e.key === "Enter" || e.key === " ") closeWordPopup();
};
$("hearLevelStoryBtn").onclick = () => {
	sounds.hear();
	say($("levelStory").textContent);
};
$("miniHearBtn").onclick = () => {
	sounds.hear();
	say("The word is " + bonusWord + ". " + bonusWord);
};
$("game_mode").onclick = () => {
	sounds.hear();
	goTo('./game_mode.html', level, stars);
};
$("game_mode_next").onclick = () => {
	sounds.hear();
	goTo('./game_mode.html', level, stars);
};

document.addEventListener("keydown", (e) => {
	if (activeMode !== "ghost") return;
	const k = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
	if (k) {
		e.preventDefault();
		moveMaze(...k);
	}
});
window.addEventListener("resize", () => {
	if (activeMode === "ghost" && document.querySelector(".ghost-maze-field")) positionMaze();
});



const sentences = ["Hi!", "I am Mark!", "What is your name?", "Wait!", "I am in Class 1A.", "What class are you in?", "Hello, Eric.", "I am Miss Hill.", "What is it?", "It is a pencil case.", "What are they?", "They are erasers.", "Oh, look!", "I am Eric.", "We are friends!", "Be quiet, boys!"];
let sentenceDeck = [];
let blankIndices = [];
let sentenceAnswers = [];
let activeBlank = 0;
let undoHistory = [];
let sentenceAwarded = false;
let sentenceNextTimer = null;

function makeBlanks(sentence) {
	const candidates = [...sentence].map((ch, i) => ch === " " ? -1 : i).filter(i => i >= 0);
	return shuffle(candidates).slice(0, Math.min(4, candidates.length)).sort((a, b) => a - b);
}

function syncSentenceState() {
	params.set("level", level);
	params.set("stars", stars);
	try { history.replaceState(null, "", "?" + params.toString()); } catch (error) {}
}

function chooseWord() {
	clearTimeout(sentenceNextTimer);
	closeWordPopup();
	if (!sentenceDeck.length) sentenceDeck = shuffle(sentences);
	current = { word: sentenceDeck.pop() };
	blankIndices = makeBlanks(current.word);
	sentenceAnswers = Array(blankIndices.length).fill("");
	activeBlank = 0;
	undoHistory = [];
	checking = false;
	sentenceAwarded = false;
	emoji.textContent = "✏️";
	$("gameHeading").textContent = "Fill in the Blanks";
	hint.textContent = "Choose letters or punctuation. Capital and small letters are different.";
	setPrompt("Fill " + blankIndices.length + " blanks. Spaces are already included!");
	message.textContent = "";
	randomBg();
	render();
}

function render(result = null) {
	slots.replaceChildren();
	let position = 0;
	current.word.split(" ").forEach((word, wordIndex) => {
		const group = document.createElement("span");
		group.className = "sentence-word";
		[...word].forEach(ch => {
			const blank = blankIndices.indexOf(position);
			let cell;
			cell = document.createElement("button");
			cell.type = "button";
			cell.className = "sentence-blank" + (blank === activeBlank && !sentenceAwarded ? " active" : "");
			cell.textContent = sentenceAnswers[blank] || "_";
			cell.setAttribute("aria-label", "Blank " + (blank + 1) + (sentenceAnswers[blank] ? ": " + sentenceAnswers[blank] : ""));
			if (blank < 0) {
				cell.disabled = true;
				cell.className = "sentence-char";
				cell.textContent = ch;
			}
			cell.disabled = sentenceAwarded;
			cell.onclick = () => { activeBlank = blank; render(); };
			if (result) cell.classList.add(result[blank] ? "good" : "bad");
			group.appendChild(cell);
			position += 1;
		});
		
		if (1==1) {
			const blank = -1;
			let cell;
			cell = document.createElement("button");
			cell.type = "button";
			cell.className = "sentence-char";
			cell.textContent = " ";
			cell.setAttribute("aria-label", "Blank " + (blank + 1) + (sentenceAnswers[blank] ? ": " + sentenceAnswers[blank] : ""));
			cell.setAttribute("disabled", "disabled");
			cell.disabled = sentenceAwarded;
			group.appendChild(cell);
		}
		
		slots.appendChild(group);
		if (wordIndex < current.word.split(" ").length - 1) {
			slots.appendChild(document.createTextNode(" "));
			position += 1;
		}
	});
	letters.replaceChildren();
	const required = blankIndices.map(i => current.word[i]);
	const cases = required.filter(ch => /[a-z]/i.test(ch)).map(ch => ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase());
	const extras = shuffle("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!?.,1A".split("")).slice(0, 5);
	const choices = [...new Set([...required, ...cases, ...extras])];
	if (!current.choices) current.choices = shuffle(choices);
	current.choices.forEach(ch => {
		const button = document.createElement("button");
		button.type = "button";
		button.className = "letter";
		button.textContent = ch;
		button.disabled = sentenceAwarded;
		button.onclick = () => pick(ch);
		letters.appendChild(button);
	});
	$("undoBtn").disabled = !undoHistory.length || sentenceAwarded;
}

function pick(ch) {
	if (sentenceAwarded) return;
	sounds.click();
	undoHistory.push({ index: activeBlank, value: sentenceAnswers[activeBlank] });
	sentenceAnswers[activeBlank] = ch;
	const empty = sentenceAnswers.findIndex(value => !value);
	if (empty >= 0) activeBlank = empty;
	render();
	if (sentenceAnswers.every(Boolean)) check();
}

function check() {
	if (sentenceAwarded) return;
	const result = blankIndices.map((position, i) => current.word[position] === sentenceAnswers[i]);
	if (result.every(Boolean)) {
		sentenceAwarded = true;
		render(result);
		sounds.win();
		awardWin(current.word);
	} else {
		activeBlank = result.findIndex(ok => !ok);
		render(result);
		message.textContent = "Good try! Fix the red blanks. Check capitals and punctuation.";
		sounds.wrong();
	}
}

function awardWin(sentence) {
	stars += 1;
	if (stars % 3 === 0) level += 1;
	starsEl.textContent = stars;
	levelEl.textContent = level;
	updateProgress(level, stars);
	syncSentenceState();
	message.textContent = "⭐ Great! You completed the sentence.";
	setPrompt("Well done!");
	say(sentence);
	if (stars % 3 === 0) sentenceNextTimer = timers.setTimeout(showLevelUp, 1200);
	else sentenceNextTimer = timers.setTimeout(chooseWord, 2200);
}

$("undoBtn").onclick = () => {
	if (!undoHistory.length || sentenceAwarded) return;
	const last = undoHistory.pop();
	sentenceAnswers[last.index] = last.value;
	activeBlank = last.index;
	message.textContent = "";
	sounds.undo();
	render();
};
$("hearBtn").onclick = () => { sounds.hear(); say(current.word); };
window.addEventListener("pagehide", () => clearTimeout(sentenceNextTimer));

$("gamePage").style.display = "block";
activateMode("spell");
updateProgress(level, stars);
</script>
</body>
</html>
