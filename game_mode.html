<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bdeaff">
<title>Robo-Monster Spelling Academy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="manifest" href="./site.webmanifest">
<link rel="stylesheet" href="./assets/styles.css">
<style>
#modeSelect {
	position: static;
	inset: auto;
	overflow: visible;
	padding: 0;
	margin-top: 18px;
}
.mode-card {
	max-height: none;
	overflow: visible;
}
.extra-links {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
	gap: 14px;
	margin-top: 18px;
}
.extra-link {
	border: 0;
	border-radius: 24px;
	padding: 18px 16px;
	font: 900 clamp(18px, 4.5vw, 25px) "Trebuchet MS", sans-serif;
	color: #333;
	cursor: pointer;
	box-shadow: 0 7px 0 rgba(0,0,0,.16);
	touch-action: manipulation;
}
.extra-link small {
	display: block;
	margin-top: 5px;
	font: 800 clamp(13px, 3.2vw, 17px) "Trebuchet MS", sans-serif;
	color: #555;
}
.extra-link.gift { background: linear-gradient(180deg, #fff0b6, #ffd166); }
.extra-link.story { background: linear-gradient(180deg, #e7dcff, #b39dff); }
.extra-link:active { transform: translateY(3px); box-shadow: 0 4px 0 rgba(0,0,0,.16); }
.extra-link:focus-visible { outline: 4px solid #5b2a86; outline-offset: 3px; }
</style>
</head>
<body>
<main class="wrap">
	<section>
		<header>
			<h1 id="gameHeading"></h1>
			<div class="badges">
				<div class="badge" id="game_mode_badge">🎮 Mode</div>
				<div class="badge" id="level_badge">🏆 Level <span id="level">1</span></div>
				<div class="badge" id="gift_badge">⭐ Stars <span id="stars">0</span></div>
			</div>
		</header>
		<div class="mode-select" id="modeSelect">
			<div class="mode-card">
				<h2>Choose One Game Mode</h2>
				<p>Select one adventure to begin. After every level-up, the game will switch to a random mode automatically.</p>
				<div class="mode-grid">
					<button class="mode-btn" data-mode="spell" type="button" id="game01_spelling">
						<span class="mode-icon">🧩🔤</span>Spelling Mission<br /><small>Build the whole word</small>
					</button>
					<button class="mode-btn" data-mode="fish" type="button" id="game02_fishing">
						<span class="mode-icon">🐟🎣</span>Fish for Letters<br /><small>Help a poor dock</small>
					</button>
					<button class="mode-btn" data-mode="ghost" type="button" id="game03_ghost_maze">
						<span class="mode-icon">👻🎯</span>Ghost Letter Zap<br /><small>Zap the right letters</small>
					</button>
					<button class="mode-btn" data-mode="race" type="button" id="game04_racing">
						<span class="mode-icon">🏃💨</span>Race and Chase<br /><small>Catch the word</small>
					</button>
					<button class="mode-btn" data-mode="mole" type="button" id="game05_whack_a_mole">
						<span class="mode-icon">🐹🔨</span>Whack-a-mole<br /><small>Moles in the hole</small>
					</button>
					<button class="mode-btn" data-mode="blank" type="button" id="game06_fill_blank">
						<span class="mode-icon">🔤🧩</span>Blank Letters<br /><small>Fill in the Blank</small>
					</button>
				</div>
			</div>
		</div>
	</section>
</main>

<script src="./assets/common.js"></script>
<script src="./assets/words.js"></script>
<script src="./assets/story.js"></script>
<script>
'use strict';
const {
	$,
	getParams,
	readProgress,
	goTo,
	sounds,
	say,
} = RoboCommon;

// URL progress is used for testing and takes priority over saved progress.
// Without URL progress, use the higher of saved progress and test starting values.
const params = getParams();
const saved = readProgress();
const TEST_LEVEL = 15;
const TEST_STARS = 47;
const hasUrlLevel = params.has('level');
const hasUrlStars = params.has('stars');
const level = hasUrlLevel ? saved.level : Math.max(saved.level, TEST_LEVEL);
const stars = hasUrlStars ? saved.stars : Math.max(saved.stars, TEST_STARS);

const modeTargets = {
	game01_spelling: './game01_spelling.html',
	game02_fishing: './game02_fishing.html',
	game03_ghost_maze: './game03_ghost_maze.html',
	game04_racing: './game04_racing.html',
	game05_whack_a_mole: './game05_whack_a_mole.html',
	game06_fill_blank: './game06_fill_blank.html'
};

const starsEl = $("stars"),
	levelEl = $("level");

starsEl.textContent = stars;
levelEl.textContent = level;

Object.keys(modeTargets).forEach((id) => {
	const button = $(id);
	if (!button) return;
	button.addEventListener('click', () => {
		sounds.hear();
		goTo(modeTargets[id], level, stars);
	});
});

$('modeSelect').style.display = 'grid';
say('Choose one game mode.');
</script>
</body>
</html>
